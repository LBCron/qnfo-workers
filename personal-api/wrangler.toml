# DO-MIGRATION-NOTE-1 2026-09-22 (R3/F2): a `wrangler deploy --dry-run` validates
# client-side structure ONLY - it cannot prove the server accepts this migration. The
# class already exists (created via the API), so a real wrangler deploy may FAIL CLOSED
# (Cloudflare rejects a creating migration for an already-depended-on class). It never
# wipes. The operative deploy path remains scripts/raw_put.py (binding-preserving).

name = "personal-api"
main = "worker.js"
# charter-pillar: personal
# COMPAT-ADVANCE-WAVE-2 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# from 2026-08-01 to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the two dates:
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module);
# 2026-10-01 Durable Object eviction (pending I/O keeps this worker's Durable Object in memory until it completes). /ops/deploy reads /health through its
# COMPAT-HEALTH-BINDINGS-2 binding before the upload, keeps the date only when /health answers with the deployed VERSION
# and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
workers_dev = true

# ============================================================
# personal-api (personal twin) - canonical repo mirror (2026-09-03)
# Recreated from the live deployed bundle (no local source existed) so the
# worker now has a canonical git home + wrangler deploy path. Bindings below
# reproduce the live settings. Secrets (never in git): API_KEY, CAL_TOKEN,
# CF_TOKEN, INFRA_TOKEN.
# v3.1.0: VISION-1 personal endpoint accepts images (vision-capable WA models
# ordered first; upstream no longer answers "no image" via non-vision
# deepseek) + MEDIA-INGEST-1 image capture to R2 personal-media + D1 table.
# ============================================================

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

# WORKERS-STANDARDS-1 (owner standards 2026-10-12): logs and traces declared. Workers docs: `enabled` alone turns on logs only;
# traces need [observability.traces]. Sampled at the default rate of 1.
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

head_sampling_rate = 0.05 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01
[[d1_databases]]
binding = "PERSONAL"
database_name = "personal-life"
database_id = "e8d6c61a-10b7-4086-b81e-9e6e85afa407"

# WORKERS-AI-ATTRIBUTION-1 (#1833, 4.7.2): counts-only Workers AI attribution rows (ai_call_counters: day, worker, model,
# calls, tokens, neurons). Nothing personal is written here: chat, mail and notes stay in personal-life (PERSONAL).
[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[vectorize]]
binding = "VZ"
index_name = "personal-life"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "personal-media"

[[services]]
binding = "CAL_API"
service = "qnfo-lifecycle"
props = { caller = "personal-api", member = "calendar-api" }
environment = "production"

# Secrets (wrangler secret put): API_KEY, CAL_TOKEN, CF_TOKEN, INFRA_TOKEN, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (v4.3.0), optional OWNER_GOOGLE_EMAIL
# GOOGLE_ICS_URL (v4.7.0, GOOGLE-ICS-BRIDGE-1): the owner's Google Calendar "Secret address in iCal format".
# Set it alone (no OAuth client) and the twin reads that calendar keylessly, one paste, read-only; writes stay in the
# twin store. GET /v1/calendar/feed returns the twin's published iCal URL for the other direction (Google subscribes to it).

# PersonalTwinAgent Durable Object (deployed; class pre-exists with live instances).
# Binding-only on purpose: the class was created by a prior migration. Do NOT re-declare it
# under new_classes — Cloudflare rejects "new-class migration to a class already depended on"
# by existing Durable Objects (code 10074), verified on qnfo-ops 2026-09-14.
[[durable_objects.bindings]]
name = "PERSONAL_TWIN_AGENT"
class_name = "PersonalTwinAgent"

# DO-EXPORTS-RECONCILE-1 (2026-09-26): wrangler 4.118 fails a deploy unless every provisioned
# Durable Object class is declared in `exports`. Mirrors the qnfo-fleet-control fix.
[exports.PersonalTwinAgent]
type = "durable-object"
storage = "sqlite"

# COMPANION-LOGIN-1 (4.14.0): the companion's sign-in code is mailed to the owner's own mailbox only (the same verified
# destination qnfo-fleet-dashboard FLEET-CMD-1 mails its code to). No other address can receive mail from this binding.
[[send_email]]
name = "SEND_EMAIL"
allowed_destination_addresses = ["rwnquni@outlook.com"]

# COMPANION-DOMAIN-1: me.q08.org/* is a zone route to this worker, attached by .github/workflows/attach-me-q08-route.yml
# (scripts/attach-me-q08-route.py), not declared here.

[triggers]
# CRON-GRID-1: no trigger slower than hourly; the daily 05:05 run lives in worker.js CRON_GRID_CFG.
crons = ["5 * * * *"]
