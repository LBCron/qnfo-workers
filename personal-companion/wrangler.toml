name = "personal-companion"
main = "worker.js"
# charter-pillar: personal
# COMPAT-ADVANCE-WAVE-2 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# from 2026-08-01 to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the two dates:
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module);
# 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy reads /health through its
# COMPAT-HEALTH-BINDINGS-2 binding before the upload, keeps the date only when /health answers with the deployed VERSION
# and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"

# Native Email Routing send binding — tokenless (no EMAIL_API_KEY needed).
# Fixes owner nudge + digest which silently failed with an unset key.
send_email = [
  { name = "SEND_EMAIL" }
]

[ai]
binding = "AI"

[[services]]
binding = "EMAIL"
service = "qnfo-email"
environment = "production"
# EMAIL-CALLER-PROPS-1 (#1923, CLAUDE.md #1703 rule): qnfo-email 2.5.1+ authenticates this binding by ctx.props.caller, so
# no EMAIL_API_KEY copy is needed (this worker never held one: every EMAIL-path send got 401). Installed by qnfo-ops
# BINDING-PROPS-APPLY-1 on the canonical deploy.
props = { caller = "personal-companion" }

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "personal-media"

# VAULT-INDEXER-FOLD-1 (2026-10-01): the Obsidian vault indexer runs here now (hourly cron).
[[r2_buckets]]
binding = "VAULT"
bucket_name = "obsidian-vault"

[[d1_databases]]
binding = "PERSONAL"
database_id = "e8d6c61a-10b7-4086-b81e-9e6e85afa407"

[[vectorize]]
binding = "VZ"
index_name = "personal-life"

[[workflows]]
name = "companion-generation"
binding = "GEN_FLOW"
class_name = "GenerationFlow"
schedules = ["0 4,8,12,16,20 * * *"]

[triggers]
# CRON-SINGLE-TRIGGER-1 (2026-10-02, #1785): ONE hourly trigger; worker.js CRON_TABLE holds the former list
# (0 * * * *, 0 21 * * *) and runs each entry in the hour it fired.
crons = ["0 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
# TRAVEL-PLANNER-1 (2026-10-19): mailed links carry secrets in the query string (wellbeing ?t=<token>, travel ?s=<hmac>).
# Workers docs: redact_query_string removes query strings from request URLs in logs and traces (applied by /ops/deploy,
# OBSERVABILITY-DECLARED-APPLY-1).
redact_query_string = true

# WORKERS-STANDARDS-1 (owner standards 2026-10-12): logs and traces declared. Workers docs: `enabled` alone turns on logs only;
# traces need [observability.traces]. Traces are sampled at the default rate of 1.
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

head_sampling_rate = 0.05 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01
[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"
