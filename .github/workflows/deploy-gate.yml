name: deploy-gate

# MERGE-STREAMLINE-1 (2026-10-26, owner directive: "DEPLOY GATE REPEATEDLY FAILS. GET RID OF IT! IT'S HOLDING UP PR MERGES."): on a pull
# request every step here is advisory (continue-on-error), so the `gate` check reports success and never holds a merge; a failure still
# shows in the step log and annotations. On push to main, the nightly run and merge_group the steps stay strict: ci-watchdog files a red
# main run, and canary plus automatic revert remain the one safety net after a merge.

# The repo IS the deploy source: qnfo-fleet-control redeploys qnfo-ops from main on a */20
# cron. A broken bundle or a leftover merge marker on main is therefore not merely a red CI
# run -- it is a bundle the cron can carry, or silently fail to carry (WORKER-BUILD-GATE-1).
# This workflow is the permanent gate that must stay green before anything reaches main.
#
# Gates enforced (see scripts/deploy_gate.py):
#   WORKER-BUILD-GATE-1     `wrangler deploy --dry-run` -- a REAL bundle build
#   CONFLICT-MARKER-GATE-1  # The coordinated + logged deploy itself happens LOCALLY under
# `deploy_guard.py with-lock` (DEPLOY-GUARD-BYPASS-1); CI validates the artifact, it does
# not deploy.

on:
  push:
    branches: [main]
  # TWO-PR-WORKFLOWS-1 (2026-11-04, owner directive: a maximum of two workflows per pull request): no pull_request trigger. pr-checks calls this file
  # as a job, so github.event_name stays pull_request inside it and every pull-request branch below is unchanged. Revert: restore `pull_request: branches: [main]` here.
  workflow_call:
  # GATE-NIGHTLY-FULL-1 (2026-10-17): a PR validates only its changed directories (PRS-SCOPE-1), so
  # without this the full 429-suite sweep ran only on a push to main - i.e. after the merge. Once a day (GHA-COST-1: was every two hours).
  # MERGE-BOUNDARY-GATE-1 (2026-10-19): a PR that touches a control-plane worker or a shared path runs the full set before the merge
  # (scripts/run-suites.mjs), every PR loads every worker, and ci-watchdog files a suite-red finding for a red full run on main.
  schedule:
    - cron: "43 6 * * *"
  # MERGE-BOUNDARY-GATE-1 (2026-10-19, agent_issues 2830): path A of the issue, switched on by a repository setting. When a merge queue
  # is enabled on main, the queue runs this workflow on the merge group's head; it takes the full-set branch below (not the
  # pull-request one), so the commit that would land is validated with every suite before it lands. Inert while no queue exists.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# GATE-RUN-ALL-1 (2026-10-06): every check step runs even after an earlier one failed (if: !cancelled()), so one broken
# suite no longer hides the result of every later suite; the job still fails if any step failed. On 2026-10-05 the dashboard
# breakage stopped the gate at objective-apply and the suites after it never ran on PRs #617-#619.

# GHA-AUDIT-1 (2026-10-13): the gate only reads the repository (Cloudflare calls use the CF token), so the GitHub token is
# read-only. A newer push to the same PR cancels the superseded gate run; push runs on main are grouped per sha and never
# cancel one another. The longest gate in the 2026-10-13 sample took 460 s, so 30 minutes bounds a hung step.
permissions:
  contents: read

# PUSH-COALESCE-1 (2026-11-04, pillar autonomy): a burst of merges queued one run of this workflow per pushed sha (66 of 100 queued runs at 15:54Z were push runs, 38 merges in the last hour). Only the newest main matters, so a newer push cancels the older run; ci-watchdog reads only conclusion failure, so a cancelled run files nothing. Revert: group by github.sha and cancel only on pull_request.
concurrency:
  group: deploy-gate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && 'main-push') || github.sha }}
  # PUSH-CONCLUDE-1 (2026-11-04, requested by the open-issues session from the runs API): with cancel-in-progress true for a push, 94 of the last 100 push runs on main (16:56Z to
  # 20:05Z) were cancelled by the next merge, 5 concluded (all red) and none was green: with a merge every ~2 minutes and a gate of ~4, the full suite concluded only in a quiet window,
  # so a red main stayed unseen for hours. The constant main-push group with cancel-in-progress false keeps one run and one pending (a newer pending replaces an older one), so runner
  # pressure stays bounded and the gate concludes every run-length. A pull request still cancels its older run. Revert: add `|| github.event_name == 'push'` back.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # RUNNER-PIN-1 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest migrates to Ubuntu 26 from 2026-10-19 (the notice is on every run); pinned until a trial run on ubuntu-26.04 is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # GATE-NODE-22-1 (2026-10-12): the whole job runs on Node 22. Several offline suites import node:sqlite (Node 22+); the
      # job used to start on Node 20 and switch to 22 only in a later conditional step, so a PR that skipped that step failed
      # IDEA-CHAIN-SINGLE-PRODUCER-1 with "No such built-in module: node:sqlite" (PR 989, 2026-10-12 13:12Z) while others passed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Determine changed worker dirs
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^"
          fi
          git diff --name-only "$BASE" HEAD 2>/dev/null | awk -F/ 'NF>1{print $1}' | sort -u | sed '/^$/d' > /tmp/changed.txt || true
          echo "changed dirs:"; cat /tmp/changed.txt || true
          # MERGE-BOUNDARY-GATE-1: a change to a file at the repository root (deploy-targets.txt, the root worker.js and wrangler.toml)
          # names no directory, so it selected no suite at all. The suite selection reads this copy, where "." marks it as a shared path;
          # the build gate above keeps reading /tmp/changed.txt (a root marker is not a worker directory). Prose files do not count.
          cp /tmp/changed.txt /tmp/changed-suites.txt
          git diff --name-only "$BASE" HEAD 2>/dev/null | awk -F/ 'NF==1 && $0 !~ /(\.md|\.cff)$/ && $0 != "LICENSE" && $0 != "codemeta.json" {print "."}' | sort -u >> /tmp/changed-suites.txt || true

      # PR-NO-DEPLOY-TOKEN-1 (2026-10-13): the build gate is `wrangler deploy --dry-run`, which bundles locally; it passed
      # without any Cloudflare credential for qnfo-fleet-dashboard and the container worker qnfo-code-orchestrator. A pull
      # request run therefore gets no token (it can deploy and delete workers); pushes to main and dispatches keep it.
      - name: Gate every changed worker dir (build + conflict markers)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
        run: |
          set -euo pipefail
          rc=0
          while read -r d; do
            [ -z "$d" ] && continue
            if [ -f "$d/wrangler.toml" ]; then
              echo "::group::deploy-gate $d"
              python3 scripts/deploy_gate.py --check "$d" || rc=1
              echo "::endgroup::"
            else
              echo "skip $d (no wrangler.toml)"
            fi
          done < /tmp/changed.txt
          exit $rc

      - name: Gate ALL worker dirs (full sweep on manual dispatch)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rc=0
          for d in */ ; do
            d="${d%/}"
            if [ -f "$d/wrangler.toml" ]; then
              echo "::group::deploy-gate $d"
              python3 scripts/deploy_gate.py --check "$d" || rc=1
              echo "::endgroup::"
            fi
          done
          exit $rc

      # CRON-RATE-CEILING-1 (owner directive 2026-09-23): no worker cron may execute more
      # than once every 10 minutes, nor more than 144 times in any 24-hour period.
      # Runs on EVERY push over ALL worker dirs -- a cron regression must fail CI even when
      # the edited worker is not the one carrying the offending cron.
      # AUDIT-SELFTEST-PR-1 (2026-10-26, AUDIT-CRASH-FIX-1): the fleet self-audit and the drift guard it reads were exercised only inside
      # fleet-autodeploy, after the merge. Three code-loop pull requests (4201, 4221, 4226) changed scripts/fleet-autoaudit.py, passed every
      # check here and then crashed every audit run for nine hours (`TypeError: 'bool' object is not iterable`): worker_live_audit froze, four
      # runner merges stayed 'deployed' and held their workers busy, and five green research-exec pull requests were deferred. Both selftests are
      # offline and take a second; the audit one replays the guard's real output (scripts/deploy-drift-guard-output.fixture.json), so a
      # consumer that cannot read the producer's shape fails here, before the merge.
      - name: AUDIT-SELFTEST-PR-1 (fleet self-audit and drift guard selftests, guard's real output)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash scripts/stop-commands.sh python3 scripts/fleet-autoaudit-selftest.py
          python3 scripts/deploy-drift-guard-selftest.py

      - name: CRON-RATE-CEILING-1 sweep (all worker dirs)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() }}
        run: python3 scripts/cron_rate_guard.py --root .

      # NARRATIVE-PROMPT-GUARD-1 (2026-09-26): a free-form narrative system prompt must
      # guide PROCESS, not prescribe specific output TEXT. Fails if a narrative-generation
      # worker source re-acquires the output-text prescriptions stripped from qnfo-ai v5.28.6.
      - name: NARRATIVE-PROMPT-GUARD-1 (narrative prompt guides process, not output text)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() }}
        run: python3 scripts/narrative-prompt-guard.py

      # CLOUDFLARE-ONLY-HOST-1 (owner directive 2026-10-01): all data, dashboards and UI are hosted on Cloudflare,
      # never on claude.ai. Fails when any tracked file links a claude.ai-hosted artifact, doc or page as a place
      # the fleet or the owner keeps something. Runs on every push and PR over the whole tree.
      - name: CLOUDFLARE-ONLY-HOST-1 (no fleet data or UI on claude.ai)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() }}
        run: python3 scripts/cloudflare-only-host-guard.py

      # SKIP-TOKEN-GUARD-1 (2026-10-19): GitHub starts no push workflow for a commit whose message holds a skip-CI token anywhere, and a squash
      # merge builds the main commit's message from the pull request's title, description and commits. The merge of #2811 explained the token in
      # its description and lost the push runs of that merge (03d801a0: no deploy, no migration apply, no guards). Bot status commits carry the
      # token on purpose and never pass through a pull request, so a pull request that names it fails here. The text reaches the script
      # through the environment, never the command line.
      - name: SKIP-TOKEN-GUARD-1 (a pull request names no skip-CI token)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 scripts/skip-token-guard.py --selftest
          python3 scripts/skip-token-guard.py --base "origin/${{ github.base_ref }}"

      # WORKERS-STANDARDS-GUARD-1 (owner directive 2026-10-12, WORKERS-BEST-PRACTICES-1): a change may not ADD a known Workers anti-pattern
      # (Math.random ids/tokens, passThroughOnException, destructured ctx, string-compared secrets) or remove/omit observability and traces.
      # Diff-only, so existing debt other PRs are fixing never blocks this one; `// standards-ok: <reason>` marks a false positive.
      - name: WORKERS-STANDARDS-GUARD-1 (no new Workers anti-patterns)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/workers_standards_guard.test.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            python3 scripts/workers_standards_guard.py "origin/${{ github.base_ref }}"
          else
            python3 scripts/workers_standards_guard.py HEAD~1
          fi

      # IDENTITY-WEEKLY-1: the weekly identity review that replaced a claude.ai Routine runs in qnfo-fleet-dashboard,
      # the only worker bound to the private qnfo-identity store; its offline suite (synthetic doc, stubbed APIs,
      # recording D1, Monday-once throttle) must stay green.
      - name: IDENTITY-WEEKLY-1 offline suite (qnfo-fleet-dashboard)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node qnfo-fleet-dashboard/identity-weekly.test.mjs

      # OWNER-EDIT-1 + IDENTITY-STORE-1: the owner edits owner_docs (the Identity doc) on fleet.qnfo.org, stored in the
      # private qnfo-identity D1. The suite drives the real fetch handler against in-memory SQLite D1s (node:sqlite needs
      # Node 22, so this last step switches runtime).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # MERGE-BOUNDARY-GATE-1 (2026-10-19, agent_issues 2830): every worker entry is LOADED on every event, not only the changed
      # workers. node --check accepts the 2026-10-17 break (a relative import in personal-companion/worker.js, which killed all 30 of
      # that worker's suites and would have failed the one-module deploy); a real load with the Workers-only modules stubbed and no
      # network refuses it, and also a top-level throw and a bare package nothing bundles. About three seconds for ~100 workers.
      - name: MERGE-BOUNDARY-GATE-1 worker load gate (every worker directory, every event)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() }}
        run: node scripts/worker-load-gate.mjs

      # SUITE-RUNNER-1 (transformation levers T1.10 + T5.4): every suite of each changed worker runs here. The full set runs when a
      # control-plane worker or a shared path (scripts, .github, migrations, _shared, a root file) changes, on push to main, in a merge
      # queue's merge group, and on the daily schedule. A suite that is red for a reason outside the change is excused only by a
      # dated, referenced line in scripts/suite-quarantine.txt (the recorded override); see scripts/run-suites.mjs.
      # No suite depends on being hand-wired below (19 were not, and three had been failing on main unnoticed).
      - name: SUITE-RUNNER-1 changed-worker suites (full set for control-plane and shared changes)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        id: suites
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/run-suites.mjs --changed-file /tmp/changed-suites.txt --jobs 4 --timeout 180
          else
            node scripts/run-suites.mjs --all --jobs 4 --timeout 180
          fi

      - name: OWNER-EDIT-1 and IDENTITY-STORE-1 offline suite (qnfo-fleet-dashboard)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node qnfo-fleet-dashboard/owner-edit.test.mjs

      # OBJECTIVE-REVISION-APPLY-1 + OWNER-NOTES-ROUTE-1: owner decisions made on fleet.qnfo.org are applied on Cloudflare
      # (ratified weight changes, constraints filed as fleet work, card notes queued as intents), never by a session.
      - name: OBJECTIVE-REVISION-APPLY-1 and OWNER-NOTES-ROUTE-1 offline suite (qnfo-fleet-dashboard)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node qnfo-fleet-dashboard/objective-apply.test.mjs

      # WATCHMAKER-INDEX-1: the fleet's own daily count of recurring operations that still need a person or a session.
      - name: WATCHMAKER-INDEX-1 offline suite (qnfo-fleet-dashboard)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node qnfo-fleet-dashboard/watchmaker.test.mjs
      - name: TEXT-QUALITY-LOOP-1 generator inventory offline suite (qnfo-fleet-dashboard)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node --no-warnings qnfo-fleet-dashboard/generators.test.mjs
      # FLEET-CHANGELOG-1: the Changelog tab (release detection from the deploy ledger, commit descriptions, personal-plane
      # redaction, idempotent sync with heartbeat).
      - name: FLEET-CHANGELOG-1 changelog offline suite (qnfo-fleet-dashboard)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node --no-warnings qnfo-fleet-dashboard/changelog.test.mjs

      # OWNER-QUEUE-MCP-1 (pillar autonomy): the owner's queue is readable and answerable from any MCP client through the
      # dashboard's own emailed-code gate (qnfo-tools-mcp owner_queue / owner_code / owner_act); the code never reaches mcp_log.
      - name: OWNER-QUEUE-MCP-1 offline suite (qnfo-tools-mcp)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node qnfo-tools-mcp/owner-queue.test.mjs

      # MSGRAPH-MAIL-1 + MSGRAPH-NO-CODES-1 (pillar personal): Outlook.com mail through Microsoft Graph into email_index.
      # Mocked Microsoft login and Graph over a node:sqlite D1; one-time codes must never be indexed.
      - name: MSGRAPH-MAIL-1 offline suite (personal-api)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() }}
        run: node --test personal-api/msgraph/msgraph.test.mjs
      # AWAY-GATE-2 (pillar personal, #1884): the brief hides Amsterdam on-site events inside a lodging away window.
      - name: AWAY-GATE-2 offline suite (personal-api)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node personal-api/away-gate.test.mjs
      # CONNECTION-LEDGER-1 step 1 (pillar personal, #1951): went answers become Ledger people and in_person interactions, idempotently.
      - name: CONNECTION-LEDGER-1 offline suite (personal-api)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node personal-api/ledger-sync.test.mjs
      # ITINERARY-INGEST-1 + SOURCE-FRESHNESS-1 (pillar personal, #1881): flight/hotel confirmation parser, idempotent upsert,
      # DMARC gate and freshness guard in qnfo-email, against fakes.
      - name: ITINERARY-INGEST-1 offline suite (qnfo-email)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node qnfo-email/itinerary-ingest.test.mjs
      # WORK-WITH-ME-1 + WORK-WITH-ME-METRIC-1 (pillar reach): qnfo.org/work-with-me makes no claim STRATEGY s2.2 rules out,
      # every offer mails rowan.quni@qnfo.org with a [work-with-me:<offer>] subject tag and valid JSON-LD; the reach ingest
      # counts those tagged contacts and the page's RUM views over 30 days, idempotently, into reach_signals and metric_registry.
      # Q08-METRICS-1 (pillar reach): q08 counts human vs crawler reads per day and serves the 7d aggregates on /api/metrics.
      - name: Q08-METRICS-1 offline suite (q08-signal-engine)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: |
          node q08-signal-engine/metrics.test.mjs
          node q08-signal-engine/phrase-revise.test.mjs
      - name: Q08-WRITE-ROUTES-TOKEN-1 offline suite (q08-signal-engine)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node --no-warnings q08-signal-engine/write-routes.test.mjs
      - name: WORK-WITH-ME-1 page suite (qnfo-gateway)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node qnfo-gateway/work-with-me.test.mjs
      - name: WORK-WITH-ME-METRIC-1 offline suite (qnfo-fleet-dashboard)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node qnfo-fleet-dashboard/work-with-me.test.mjs
      # ASK-LOOP-1: ask.qwav.tech measures, evaluates, tunes and dispatches its own fixes (qnfo-ai-search). The suite drives
      # the real handler and cron with stubbed AI Search, gateway, idea-hub and Workers AI over in-memory SQLite.
      - name: ASK-LOOP-1 offline suite (qnfo-ai-search)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node qnfo-ai-search/ask-loop.test.mjs
      # SELECTED-WORKS-OPENALEX-1 (#1786) + IMPACT-FAILCLOSED-2 (#1782): the daily citation pass measures all seven selected
      # works (STRATEGY s2.4) whatever their age, and /run?commit=1 refuses callers while IMPACT_TOKEN is unset.
      - name: SELECTED-WORKS-OPENALEX-1 offline suite (qnfo-paper-indexer)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node qnfo-paper-indexer/impact.test.mjs
      # AIG-BINDING-1 (#1784): qnfo-ai embedding calls go through AI Gateway default (24h cache, metadata worker/purpose on
      # the log entry, one plain-binding retry on a gateway error); chat calls and caller options are unchanged.
      - name: AIG-BINDING-1 offline suite (qnfo-ai)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node qnfo-ai/aig-binding.test.mjs
      # DS-402-BREAKER-1 (qnfo-ai 5.31.2): an empty DeepSeek balance (HTTP 402) opens a 60-minute breaker instead of a
      # failed paid round trip per request.
      - name: DS-402-BREAKER-1 offline suite (qnfo-ai)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node --no-warnings qnfo-ai/ds-402-breaker.test.mjs
      # ENSEMBLE-RUN-LOG-1 (qnfo-ai 5.31.3, #1889): every ensemble call leaves one cloud_ops_events row with the primary
      # and validator families and the verdict, so same-family agreement is measurable. ENSEMBLE-FAMILY-DISJOINT-1
      # (5.31.4): the same suite holds the pool to one model per family and the validator to another family than the primary.
      - name: ENSEMBLE-RUN-LOG-1 offline suite (qnfo-ai)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node --no-warnings qnfo-ai/ensemble-run-log.test.mjs
      # UTF8-DEPLOY-1: worker source fetched from GitHub reaches the upload as the same UTF-8 text (no double encoding).
      - name: UTF8-DEPLOY-1 offline suite (qnfo-ops)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() && steps.suites.outputs.mode != 'full' }}
        run: node qnfo-ops/utf8-deploy.test.mjs
      # CRON-APPLY-PARSE-1: the canonical deploy applies the [triggers] crons assignment, not the first "crons" in a comment
      # (radar-hub, qnfo-cloud-ops and qnfo-fleet-dashboard schedules were never applied); sweeps every live wrangler.toml.
