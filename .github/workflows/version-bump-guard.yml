name: version-bump-guard

# VERSION-BUMP-GUARD-1 (2026-09-29, issue 1371).
#
# Closes the silent never-deploys class: a worker fix committed WITHOUT a VERSION bump is
# invisible to fleet-autoaudit.py --apply (strictly-ahead numeric version), to deploy-drift.yml
# (VERSION string comparison) and to mirror-guard.py (source vs mirror). All three stay green
# while the fix stays on main forever.
#
# Verified live instances at the time of writing
#   * qnfo-backlog-exec - HEALTH-PROBE-BUDGET-1 (#1368) committed with VERSION unchanged at
#     2.0.0-full-register-inventory; repo bundle 33,159 B vs live script 33,161 B.
#   * worker_live_audit recorded qnfo-ops at 2.37.14-callglm-reasoning while live had advanced
#     to 2.37.20-selfheal-analyzer-live (six-version lag).
#
# ADVERSARIAL - a green run proves only that a VERSION string changed with the bytes. It does
# NOT prove the change is correct, that the bump went in the right direction, or that the worker
# deployed. Version parity is not behaviour parity.
#
# CI-DEP-MISSING-1 (2026-09-29, fix): the lint step below calls scripts/workflow-lint.py, which
# hard-depends on PyYAML. setup-python@v5 does NOT provide it, so the lint exited 2 and the two
# substantive steps were skipped - the guard was red for a missing dependency, not for a version
# violation, and never evaluated a diff. The install step is REQUIRED, not cosmetic.

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '*/worker.js'
      - '*/deployed-current.worker.js'
      - 'scripts/version-bump-guard.py'
      - 'scripts/cf-import-guard.py'
      - '.github/workflows/version-bump-guard.yml'
  # INTEG-GITHUB-HARDEN-1 (agent_issues 2927, 2026-10-19): no `paths:` filter on the pull_request trigger. This job (`guard`) is a
  # required check of the main ruleset; GitHub does not run a workflow whose paths a pull request leaves alone, and a required check that
  # never runs stays "Expected" for ever, so a migrations-only or docs-only pull request could never merge. With no worker bundle in the
  # range the version guard prints "nothing to check" and exits 0 (verified), so the filter saved only runner minutes.
  workflow_dispatch:

permissions:
  contents: read

# CONCURRENCY-PER-REF-1 (2026-09-30): this group used to be the constant `version-bump-guard`
# with cancel-in-progress: true, and the workflow runs for a push or PR on ANY branch. A run on
# one ref therefore cancelled the in-flight run on every other ref: run 36732557644 (the guard
# for PR 87's head) was cancelled 4 s after it started, leaving the required-looking `guard`
# check as `cancelled` on a commit whose content nothing had rejected. Scope the group to the
# ref so a newer push supersedes only an older run of the SAME ref. github.ref differs between
# the push event (refs/heads/x) and the pull_request event (refs/pull/N/merge), so those two
# never cancel each other either.
# VERSION-BUMP-PUSH-SHA-1 (2026-10-20, PR-GUARD-FIXES-1, agent_issues 100295): the group was still the REF for a push to main, so a burst
# of pushes there cancelled the earlier runs: 35 of 277 push-to-main runs from 2026-10-18 to 2026-10-20 (read from the runs API on
# 2026-10-20) were `cancelled`, 9 of them in the 07:00Z hour of 2026-10-19, and the commits of that burst were never validated.
# Three of them (4f20a3e9, 4343df37, 26e89a17) carried a stale copy of qnfo-code-orchestrator/worker.js whose VERSION went
# backwards and whose fixes were absent; this guard would have flagged them (VERSION-AHEAD-1) and was cancelled instead. A push to
# main now has one group per commit and is never cancelled, as mirror-guard.yml does (its group is per sha for a push). Every other
# ref keeps the per-ref group and the cancel: a newer push to a branch or pull request supersedes the older run of the same ref,
# which is all CONCURRENCY-PER-REF-1 wanted.
# PUSH-COALESCE-1 (2026-11-04, pillar autonomy): a burst of merges queued one run of this workflow per pushed sha (66 of 100 queued runs at 15:54Z were push runs, 38 merges in the last hour). Only the newest main matters, so a newer push cancels the older run; ci-watchdog reads only conclusion failure, so a cancelled run files nothing. Revert: group by github.sha and cancel only on pull_request.
concurrency:
  group: version-bump-guard-${{ github.ref == 'refs/heads/main' && 'main-push' || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth 0 is REQUIRED: the guard diffs two refs and fails closed (exit 3)
          # rather than guessing when a ref is unavailable in a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # REQUIRED: workflow-lint.py imports yaml and fails closed when it is absent.
      - name: Install lint dependency (PyYAML)
        run: python -m pip install --quiet pyyaml

      - name: Lint the workflow YAML class repo-wide
        run: |
          set -euo pipefail
          if [ -f scripts/workflow-lint.py ]; then
            python3 scripts/workflow-lint.py
          else
            echo "no workflow-lint.py in this revision; skipping"
          fi

      # CF-IMPORT-GUARD-1: a worker bundle must not import a name the runtime does not provide.
      # `import { Container } from "cloudflare:workers"` (written by the now-retired
      # fix-pilot-container-class workflow) made every upload of qnfo-containers-pilot fail with
      # Cloudflare error 10021 while the live worker kept serving; see scripts/cf-import-guard.py.
      - name: Forbidden Cloudflare module imports
        run: |
          set -euo pipefail
          python3 scripts/cf-import-guard.py

      - name: Resolve the diff range
        id: range
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.sha }}'
          BASE_REF='${{ github.base_ref }}'
          BASE_REF="${BASE_REF:-main}"
          # GUARD-RANGE-FIRSTPUSH-1 (2026-10-19): a new branch's FIRST push carries
          # event.before = all-zeros, and the fallback here used HEAD~1 - the second-to-last
          # commit of the push. A first push that carries more than one commit (branch cut from
          # main, two commits, the VERSION bump in the first of them) was therefore validated
          # over its last commit only: PR 2012's push run reported "unchanged VERSION" while the
          # branch had moved qnfo-* 1.2.0 -> 1.3.0 and live served 1.3.0. The branch's own base
          # is the right floor, so resolve it before falling back to a single commit. HEAD~1
          # stays as the last resort for a branch whose base cannot be fetched.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" 2>/dev/null || true
            MB=$(git merge-base "origin/$BASE_REF" "$AFTER" 2>/dev/null || true)
            if [ -n "$MB" ]; then
              echo "first push (event.before is all-zeros); validating merge-base with origin/$BASE_REF: $MB"
              BEFORE="$MB"
            else
              echo "first push and origin/$BASE_REF is unknown; falling back to HEAD~1 (single commit)"
              BEFORE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            fi
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # GUARD-RANGE-FORCEPUSH-1 (2026-09-30): after a force-push (or once a squash-merge has
            # orphaned the old tip) the event's `before` commit is not fetchable, so the guard
            # below exited 3 on runs 36734137517 and 36734650689 although nothing was wrong with
            # the change. Validate everything the branch adds beyond main instead. That range is
            # a superset of the pushed delta, so it can only be stricter. If even the merge base
            # cannot be resolved, BEFORE stays unresolvable and the guard still fails closed.
            MB=$(git merge-base origin/main "$AFTER" 2>/dev/null || true)
            if [ -n "$MB" ]; then
              echo "before $BEFORE is not in this clone (force-push); validating merge-base with origin/main instead: $MB"
              BEFORE="$MB"
            fi
          fi
          # GUARD-RANGE-MERGE-1 (2026-09-30): a pull_request `synchronize` event carries
          # event.before = the previous PR head, and a push of a "merge main into branch" commit
          # carries event.before = the previous branch tip. Either way before..after then spans
          # every bundle main changed since the branch last synced, so runs 36792109129 and
          # 36792106197 (PR 161) blamed fleet-exec/memory-mcp/qnfo-memory-mcp - main's commits,
          # not the PR's. For a pull_request, or when AFTER is a merge commit, validate what the
          # change adds beyond its base branch instead (merge-base with the base ref).
          # GUARD-RANGE-FIRSTPUSH-1 moved the BASE_REF resolution above the first-push branch;
          # it is defined once there so both ranges use the same base.
          PARENTS=$(git rev-list --parents -n 1 "$AFTER" | wc -w)
          if [ '${{ github.event_name }}' = 'pull_request' ] || [ "$PARENTS" -gt 2 ]; then
            MB=$(git merge-base "origin/$BASE_REF" "$AFTER" 2>/dev/null || true)
            if [ -n "$MB" ] && [ "$MB" != "$(git rev-parse "$AFTER")" ]; then
              echo "pull_request or merge commit; validating merge-base with origin/$BASE_REF: $MB"
              BEFORE="$MB"
            fi
          fi
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          echo "range $BEFORE..$AFTER"

      - name: Version bump guard
        run: |
          set -euo pipefail
          # VERSION-BUMP-USEREF-SCOPE-1 (2026-10-17): on a push to a NON-default branch this run cannot
          # block anything -- there is no merge gate there, and the branch is usually still mid-edit, so
          # the violation it reports is normally fixed by a later commit on the same branch. Measured
          # 2026-10-17: these runs were the second-largest ci_activity source, all on chatbox/* and
          # session/* branches. The guard stays FATAL on:
          #   * push to main (the deploy ledger's source of truth)
          #   * every pull_request (the real pre-merge gate)
          #   * workflow_dispatch (on-demand audit)
          if ! python3 scripts/version-bump-guard.py \
                 "${{ steps.range.outputs.before }}" \
                 "${{ steps.range.outputs.after }}"; then
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "::warning title=version-bump-guard::VERSION bump violation on a non-default branch; advisory only. A pull_request run enforces this before merge."
              exit 0
            fi
            exit 1
          fi
