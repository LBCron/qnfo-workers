name: ci-watchdog

# CI-WATCHDOG-1 (2026-09-27) -- catch and remediate the qnfo-workers CI failure
# modes, across GitHub and (via the ops endpoint) the Cloudflare fleet ledger.
#
# WHY workflow_run AND NOT `on: schedule`
#   On this repository the GitHub `schedule` event has NEVER fired. Across the
#   entire run history there are ZERO runs with event=schedule, including the
#   06:17 UTC (deploy-drift) and 06:23 UTC (indexnow-submit) slots that the two
#   schedule-only workflows exist for. A monitor built on a cron expression here
#   is dead on arrival. Every push and every workflow_run, by contrast, fires.
#   So this watchdog hangs off workflow_run + workflow_dispatch, and performs its
#   own time-gated periodic sweep so it also covers quiet periods.
#
# WHAT IT DOES
#   scripts/ci_watchdog.py
#     1. silent-schedule  a workflow declares `schedule` but has ZERO
#                         schedule-event runs  -> DISPATCH it so it actually runs
#     2. mirror-lag       mirror-guard red       -> DISPATCH mirror-sync.yml
#     3. codeql-config    default-setup != configured -> PATCH it to configured
#     4. build-gate       WORKER-BUILD-GATE-1    -> file/refresh one deduped issue
#     5. invalid-workflow a run with ZERO jobs   -> file/refresh
#     6. missing-module   MODULE_NOT_FOUND       -> file/refresh
#     7. unknown          anything else          -> file/refresh with the evidence
#   Retired workflows (file no longer on the ref) are recorded, never re-run.
#
#   detect -> act -> verify. It is a GATE: exit 1 while any finding is
#   unactionable AND untracked, so a silent regression cannot pass unnoticed.
#
# Ledger: the job summary and ci-watchdog-summary.json are always produced; when
# OPS_ROUTER_AUTH_KEY is configured the summary is also POSTed to the fleet
# ledger so the Cloudflare side sees the same rows.

on:
  workflow_run:
    workflows:
      - mirror-guard
      - version-compare
      - deploy-gate
      - mirror-sync
      - deploy-drift
      - indexnow-submit
      - adversarial-workers-guard
      - code-loop-test
    types: [completed]
    # MAIN-ONLY-FINDINGS-1: a pull-request run's red check belongs to that PR (scripts/ci_watchdog.py skips it), so
    # it no longer starts a sweep either.
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [ci-watchdog]

permissions:
  actions: write        # dispatch a stuck workflow, re-run the healer
  issues: write         # file/refresh the deduped finding
  contents: read
  # Required so the CodeQL default-setup probe observes instead of 403ing.
  # Without it the watchdog reported an authz error as drift and could
  # never pass: an unauthorized probe is not evidence.
  security-events: read

# ACTIONS-QUOTA-1 (2026-10-02): ONE group for the whole repository. The group used to be keyed on the
# TRIGGERING run's branch, so every PR branch got its own lane and a merge burst ran up to 19 sweeps at
# once. A sweep reads repository-wide state (all workflows, the newest 100 runs) and never looks at which run
# triggered it, so parallel sweeps were pure duplicates: measured 2026-10-01/02, 2,031 watchdog runs in 24h,
# ~745 executed at ~150 REST calls each, ~4,600 calls an hour from the bucket CodeQL's SARIF upload also
# draws on ("API rate limit exceeded for installation" on PRs 435, 441, 466 and most Push-on-main runs).
# With one group at most one sweep runs and one waits; a newer trigger replaces the waiting one.
# RUNNER-PIN-ANNOTATIONS-1 (2026-10-20): the group follows the job's own `if:` below. Concurrency is decided when the run is
# created, before the job's condition is read, so a workflow_run that the condition then skips (a green watched run on any branch
# but mirror-sync) still took the one waiting slot and cancelled the waiting run that had real work. That is the one avoidable cause
# of the cancelled runs in the audit sample (82 of 263 runs in 9 hours). A run whose job will be skipped now gets a group of its own,
# costs nothing and evicts nothing; every run that sweeps shares `ci-watchdog` exactly as before. Keep the two predicates identical
# (scripts/runner-pin-annotations.test.mjs evaluates both for every trigger).
concurrency:
  group: ${{ (github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'mirror-sync' && github.event.workflow_run.conclusion != 'cancelled') || !contains(fromJSON('["success", "cancelled", "skipped", "neutral"]'), github.event.workflow_run.conclusion)) && 'ci-watchdog' || format('ci-watchdog-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  watch:
    # ACTIONS-QUOTA-1: sweep when there is something new to look at. A sweep runs on
    #   * every dispatch (workflow_dispatch / repository_dispatch);
    #   * every mirror-sync completion: mirror-sync runs once per push to main, so the periodic sweep keeps
    #     the cadence of main (it was 4 sweeps per push: mirror-guard, version-compare, deploy-gate, mirror-sync);
    #   * every watched run on main that did not succeed (failure, timed_out, startup_failure, ...).
    # A green PR check no longer starts a repository-wide sweep on its own; a failure anywhere in the newest 100
    # runs is still picked up by the next sweep (6h window, unchanged). A skipped job costs no API call.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.name == 'mirror-sync' && github.event.workflow_run.conclusion != 'cancelled') ||
      !contains(fromJSON('["success", "cancelled", "skipped", "neutral"]'), github.event.workflow_run.conclusion)
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run the watchdog
        id: wd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Cross-platform ledger: the script mirrors its summary into the QNFO
          # fleet ledger when the ops key is present, and no-ops when it is not,
          # so the watchdog still gates on its own exit code either way.
          OPS_KEY: ${{ secrets.OPS_ROUTER_AUTH_KEY }}
          # ACTIONS-QUOTA-1: a sweep samples only the workflows that declare a schedule (13 run listings
          # instead of 80 plus ~65 contents reads). A manual dispatch samples every workflow, as before.
          CI_WD_FULL_INVENTORY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          set +e
          python scripts/ci_watchdog.py | tee /tmp/wd.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Job summary
        if: always()
        run: |
          {
            echo "### ci-watchdog"
            echo ""
            echo '```'
            tail -n 60 /tmp/wd.log 2>/dev/null || echo "no log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the chain-of-custody payload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-watchdog-summary
          path: ci-watchdog-summary.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail closed on an unactionable, untracked finding
        if: steps.wd.outputs.rc != '0'
        run: |
          echo "::error::ci-watchdog exited ${{ steps.wd.outputs.rc }}: a finding is unactionable and untracked"
          exit 1
