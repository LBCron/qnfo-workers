name: deploy-containers-pilot

# CONTAINER-DEPLOY-WORKFLOW-MISSING-1 (2026-09-29). This file did not exist; it is the
# workflow qnfo-containers-pilot/wrangler.toml references as the only path that transmits
# [[containers]].
#
# CONTAINER-CONFIG-DROPPED-1 (2026-09-29, issue #1485) — REMAINING GAP this revision closes.
# Live incident: qnfo-ops:cf_worker_deploy PUT /content with metadata. GET /bindings returns
# ONLY {d1 AUDIT, secret PILOT_TOKEN, durable_object_namespace SHELL_CONTAINER}, so the
# [[containers]] block was NOT preserved and every exec path now dies with
# "Cannot read properties of undefined (reading 'running')" (shell_exec, exec_python,
# exec_node, container_install, git_clone_exec, container_workspace_exec, shell_pipeline).
#
# The first revision of THIS file ran `wrangler deploy` with no fallback and published no
# artifact, so a migration-related failure (see DO-MIGRATION-NOTE-1 in wrangler.toml: a
# creating migration for an already-depended-on class can fail closed) was invisible.
# The sibling apply-container-binding-guard-1 run proved it: its ci-status artifact recorded
# wrangler_outcome="skipped" and post_version="" -- the deploy never happened and nothing
# said so.
#
# CI-ARTIFACT-NO-FAILURE-TEXT-1 + VERIFY-FALSE-GREEN-1 (2026-09-29, measured on the
# 19:37:34Z run). That run published wrangler_outcome=failure nomig_outcome=failure
# verify_outcome=success. Both deploys failed and the artifact carried NO wrangler output,
# so the failure reason was unrecoverable from outside the runner; and verify_outcome=success
# was a FALSE GREEN, because the verify step exits 0 with only a warning when PILOT_TOKEN is
# absent. Ground truth at the time of writing: GET /status on the pilot returns
# {"ok":false,"error":"Cannot read properties of undefined (reading 'running')"} -- #1485
# open. This revision therefore:
#   (a) restores the wrangler log tail (the earlier revision had it; the rewrite dropped it)
#       and adds the no-migration retry log tail, so a red run is diagnosable from the repo;
#   (b) replaces the misleading verify_outcome with an explicit verify_rc output
#       (ok | skipped-no-token | ctx-container-undefined | probe-http-<code>), so "skipped"
#       can never be read as "verified".
# It never uses [skip ci] in its own commits -- a deploy trigger must never carry a skip
# token (CI-TRIGGER-SKIP-1).
#
# Trigger surface is deliberately broad (push to main + the pilot dir + dispatch) because
# the failure mode being fixed is a trigger that never fired.

on:
  push:
    branches: [main]
    paths:
      - 'qnfo-containers-pilot/**'
      - '.github/workflows/deploy-containers-pilot.yml'
  workflow_dispatch:
    inputs:
      verify_only:
        description: "true = skip deploy, only run the container verification probe"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: deploy-containers-pilot
  cancel-in-progress: false

jobs:
  deploy:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GUARD: https://qnfo-deploy-guard.q08.workers.dev
      GUARD_UA: "QNFO-fleet-ci/1.0 (+https://qnfo.org; deploy-containers-pilot)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: assert the containers block is present in wrangler.toml
        run: |
          set -euo pipefail
          f=qnfo-containers-pilot/wrangler.toml
          for key in '\[\[containers\]\]' 'class_name = "ShellContainer"' 'image = ' 'instance_type = ' 'max_instances = '; do
            if ! grep -Eq "$key" "$f"; then
              echo "::error::wrangler.toml is missing required key: $key -- refusing to deploy"
              exit 1
            fi
          done
          echo "containers block present:"
          sed -n '/\[\[containers\]\]/,/^$/p' "$f"

      - name: wrangler deploy (primary - transmits [[containers]])
        id: wrangler
        if: ${{ github.event.inputs.verify_only != 'true' }}
        continue-on-error: true
        working-directory: qnfo-containers-pilot
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --keep-vars 2>&1 | tee /tmp/wrangler.log
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: retry wrangler without the DO migration block
        id: nomig
        if: ${{ github.event.inputs.verify_only != 'true' && steps.wrangler.outcome != 'success' }}
        continue-on-error: true
        working-directory: qnfo-containers-pilot
        run: |
          set -o pipefail
          echo "--- primary wrangler deploy failed; stripping [[migrations]] and retrying ---"
          echo "--- rationale: the ShellContainer class already exists (created via the API), so a"
          echo "--- creating migration may be rejected (DO-MIGRATION-NOTE-1). The class is not"
          echo "--- recreated by omitting the block; the container config still ships. ---"
          cp wrangler.toml /tmp/wrangler.toml.orig
          sed -i '/^\[\[migrations\]\]/,/^$/d' wrangler.toml
          cat wrangler.toml
          npx --yes wrangler@4 deploy --keep-vars 2>&1 | tee /tmp/wrangler_nomig.log
        env:
          WRANGLER_SEND_METRICS: "false"

      # CONTAINER-DEPLOY-LEDGER-1 (2026-10-14, agent_issues 2368 and 2369): qnfo-deploy-guard decides whether a worker mutation was
      # logged by looking for a fleet_deploys row at or after the worker's modified_on (minus 3 minutes). This workflow wrote none, so
      # every wrangler deploy here (2026-10-14 03:08:13Z, when the actions bump touched this file) was filed as an unlogged mutation
      # and an uncoordinated deploy. The row is written right after the wrangler attempts, through the guard's own /ledger route
      # (as deploy-code-orchestrator.yml does). A logged mutation is never "uncoordinated" to the guard, so no lock is taken here:
      # the /content fallback below takes the guard lock and writes its own row (RESTORE-LEDGER-1), and a held lock would refuse it.
      - name: Record the wrangler deploy in the guard ledger fleet_deploys
        if: ${{ always() && github.event.inputs.verify_only != 'true' && steps.wrangler.outcome != 'skipped' }}
        env:
          WR: ${{ steps.wrangler.outcome }}
          NM: ${{ steps.nomig.outcome }}
        run: |
          set -uo pipefail
          ok=false
          if [ "$WR" = "success" ] || [ "$NM" = "success" ]; then ok=true; fi
          to="$(grep -m1 -oE '^var VERSION = "[^"]+"' qnfo-containers-pilot/worker.js | sed -E 's/.*"([^"]+)"/\1/')"
          body="$(jq -cn --arg w "qnfo-containers-pilot" --arg to "$to" --argjson ok "$ok" --arg note "wrangler deploy (deploy-containers-pilot.yml run $GITHUB_RUN_ID sha ${GITHUB_SHA::12}): wrangler=$WR nomig=$NM" \
            '{worker:$w,actor:"deploy-containers-pilot.yml",from:"",to:$to,source_path:"qnfo-containers-pilot/worker.js",ok:$ok,note:$note}')"
          res="$(curl -s --max-time 30 -A "$GUARD_UA" -H "Content-Type: application/json" -X POST "$GUARD/ledger" --data "$body")"
          echo "ledger response: $res"
          if [ "$(echo "$res" | jq -r '.logged // false' 2>/dev/null)" != "true" ]; then echo "::error::fleet_deploys ledger row not written"; exit 1; fi

      # PILOT-DEPLOY-FAIL-OPEN-1 (2026-10-01): run 36793748019 (merge 5593747) reported SUCCESS while both wrangler
      # attempts failed with [container_class_not_durable_object] / [provisioned_class_missing_from_config] (code
      # 100402): wrangler 4.86 drops the top-level `exports` table ("Unexpected fields found in top-level field"), so
      # the upload never declares ShellContainer, and continue-on-error hid it - live stayed 1.0.7 while main carried
      # 1.0.8. Fall back to scripts/restore_container_config.py (the /content path that sends `exports` and explicit
      # bindings and is proven to return 200), then gate the job on /health reporting the repo VERSION.
      - name: fallback - deploy via /content metadata (sends exports + explicit bindings)
        id: restore
        if: ${{ github.event.inputs.verify_only != 'true' && steps.wrangler.outcome != 'success' && steps.nomig.outcome != 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/restore_container_config.py 2>&1 | tee /tmp/restore.log
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER: qnfo-containers-pilot

      - name: wait for propagation
        if: ${{ github.event.inputs.verify_only != 'true' }}
        run: sleep 20

      - name: gate - live VERSION must equal the repo VERSION (fail closed)
        if: ${{ github.event.inputs.verify_only != 'true' }}
        run: |
          set -uo pipefail
          want="$(grep -m1 -oE '^var VERSION = "[^"]+"' qnfo-containers-pilot/worker.js | sed -E 's/.*"([^"]+)"/\1/')"
          got="$(curl -s --max-time 30 https://qnfo-containers-pilot.q08.workers.dev/health | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)"
          echo "repo VERSION=$want live VERSION=$got (wrangler=${{ steps.wrangler.outcome }} nomig=${{ steps.nomig.outcome }} restore=${{ steps.restore.outcome }})"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error::qnfo-containers-pilot live VERSION '$got' != repo '$want' - no deploy path succeeded"
            exit 1
          fi

      - name: verify container config is live (closes #1485)
        id: verify
        continue-on-error: true
        run: |
          set -uo pipefail
          base="https://qnfo-containers-pilot.q08.workers.dev"
          hcode="$(curl -s -o /tmp/health.json -w '%{http_code}' "$base/health" || true)"
          echo "GET /health -> $hcode"
          cat /tmp/health.json || true
          echo
          if [ -z "${PILOT_TOKEN:-}" ]; then
            echo "rc=skipped-no-token" >> "$GITHUB_OUTPUT"
            echo "::warning::PILOT_TOKEN not available to this workflow - container verification SKIPPED, #1485 NOT closed by this run"
            exit 0
          fi
          scode="$(curl -s -o /tmp/status.json -w '%{http_code}' -H "Authorization: Bearer $PILOT_TOKEN" "$base/status" || true)"
          echo "GET /status -> $scode"
          cat /tmp/status.json || true
          echo
          if grep -q "Cannot read properties of undefined" /tmp/status.json 2>/dev/null; then
            echo "rc=ctx-container-undefined" >> "$GITHUB_OUTPUT"
            echo "::error::/status reports the ctx.container-undefined signature - #1485 still open"
            exit 1
          fi
          if [ "$scode" != "200" ]; then
            echo "rc=probe-http-$scode" >> "$GITHUB_OUTPUT"
            echo "::error::/status returned $scode - container config not confirmed live (#1485 open)"
            exit 1
          fi
          echo "rc=ok" >> "$GITHUB_OUTPUT"
          echo "container config verified live"
        env:
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}

      - name: publish outcome artifact (with failure text)
        if: always()
        # PILOT-ARTIFACT-HEREDOC-1 (2026-10-01): the artifact used an unquoted heredoc, so backticks in the embedded
        # wrangler log (e.g. ```[[migrations]]```) were executed as command substitutions and the JSON broke (run
        # 36794286262: "artifact is not valid JSON" after a successful deploy). Build it in Python from env instead.
        run: |
          set -uo pipefail
          mkdir -p ci-status
          export HEALTH_HTTP="$(curl -s -o /dev/null -w '%{http_code}' https://qnfo-containers-pilot.q08.workers.dev/health || true)"
          python3 - <<'PY'
          import json, os, time
          def tail(p):
              try:
                  return open(p, errors="replace").read()[-6000:].replace("\r", "")
              except OSError:
                  return ""
          out = {
              "workflow": "deploy-containers-pilot",
              "issue": 1485,
              "wrangler_outcome": os.environ.get("W_OUT", ""),
              "nomig_outcome": os.environ.get("N_OUT", ""),
              "restore_outcome": os.environ.get("R_OUT", ""),
              "verify_rc": os.environ.get("V_RC", ""),
              "health_http": os.environ.get("HEALTH_HTTP", ""),
              "head": os.environ.get("GITHUB_SHA", ""),
              "ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "wrangler_tail": tail("/tmp/wrangler.log"),
              "nomig_tail": tail("/tmp/wrangler_nomig.log"),
          }
          json.dump(out, open("ci-status/deploy-containers-pilot.json", "w"), indent=2)
          print("artifact is valid JSON")
          PY
        env:
          W_OUT: ${{ steps.wrangler.outcome }}
          N_OUT: ${{ steps.nomig.outcome }}
          R_OUT: ${{ steps.restore.outcome }}
          V_RC: ${{ steps.verify.outputs.rc }}

      - name: commit outcome artifact
        if: always()
        run: |
          set -uo pipefail
          git config user.name "qnfo-ci"
          git config user.email "ci@qnfo.org"
          git add ci-status/deploy-containers-pilot.json || true
          git commit -m "chore(ci): deploy-containers-pilot outcome" || true
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if bash scripts/push_head.sh artifact; then echo "PUSH OK"; exit 0; fi
            sleep $((i*3))
          done
          echo "::warning::outcome artifact not pushed after retries"
          exit 0

      - name: summarize outcome
        if: always()
        run: |
          {
            echo "## deploy-containers-pilot"
            echo ""
            echo "Closes: CONTAINER-CONFIG-DROPPED-1 / issue #1485"
            echo ""
            echo "wrangler=\`${{ steps.wrangler.outcome }}\` nomig=\`${{ steps.nomig.outcome }}\` verify_rc=\`${{ steps.verify.outputs.rc }}\`"
            echo ""
            echo "A green run means \`wrangler deploy\` transmitted the [[containers]] block AND"
            echo "the authenticated /status probe came back 200 without the"
            echo "\`ctx.container\`-undefined signature. A red run is fail-closed and wipes nothing."
          } >> "$GITHUB_STEP_SUMMARY"
