name: remediation-bridge

# REMEDIATION-CONTRACT-BRIDGE-1 (2026-10-01).
#
# Measured state before this workflow: qnfo-audit held 88 open rows in
# `agent_issues` and only 2 of them carried a row in `remediation_contracts`.
# The consumer (scripts/remediation-consumer.py) verifies contracts, but nothing
# created one from an issue, so 86 of 88 open issues had no verification path at
# all and the armed auto-close triggers could never fire for them. This workflow
# runs the bridge that closes that gap, so every open issue is either (a) backed
# by a machine-executable probe, or (b) explicitly registered as
# `needs-machine-probe` and therefore visibly unverifiable instead of silently
# unverified.
#
# CADENCE (SCHEDULE-EVENT-NEVER-FIRES-1): the GitHub `schedule` event has never
# fired on this repository, so the cron below is opportunistic. The load-bearing
# triggers are `push` and `workflow_run` chained off workflows that do fire.
#
# LOOP SAFETY: this workflow writes no repository file except its own ci-status
# artifact, and that commit carries `[skip ci]`, so it cannot re-trigger itself
# or fleet-autodeploy. The chain is acyclic.
#
# ADVERSARIAL: a green run proves the bridge executed and what it counted. It
# does NOT prove the fleet is healthy, and it does NOT close any issue. A
# contract registered as `needs-machine-probe` is fail-closed: the consumer will
# not run it, so no pass can be fabricated for it. Closing still requires the
# consumer to observe expected == observed.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/remediation_contract_bridge.py'
      - 'scripts/remediation_probe_map.json'
      - '.github/workflows/remediation-bridge.yml'
  workflow_run:
    workflows: ["apply-pending-patches"]
    types: [completed]
  # AUTODEPLOY-FANOUT-1 (2026-11-04): no workflow_run on fleet-autodeploy. fleet-autodeploy calls this file as a job after its audit, so one run replaces
  # a separate run per deploy event (418 of 600 sampled runs in 3 hours were cancelled fan-out). Revert: restore the workflow_run block and delete the job in fleet-autodeploy.yml.
  workflow_call:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remediation-bridge
  cancel-in-progress: false

jobs:
  bridge:
    # CI-VELOCITY-1: a workflow_run fires for a cancelled upstream run too (a superseded pending run); skip it before it takes a runner slot.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Self-test the probe map (every probe must be a literal SELECT)
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("scripts/remediation_probe_map.json")
          if not p.exists():
              print("no probe map present; bridge registers every unmapped issue inactive")
              sys.exit(0)
          d = json.loads(p.read_text())
          bad = []
          for k, v in (d.get("probes") or {}).items():
              probe = (v or {}).get("probe") if isinstance(v, dict) else v
              s = (probe or "").strip()
              low = s.lower()
              if not (low.startswith("select") or low.startswith("with")):
                  bad.append((k, "not-a-select"))
                  continue
              for kw in ("insert into", "update ", "delete from", "drop ", "alter ",
                         "create ", "pragma ", "replace into"):
                  if kw in low:
                      bad.append((k, "write-keyword:" + kw.strip()))
                      break
              else:
                  body = s.rstrip().rstrip(";")
                  if ";" in body:
                      bad.append((k, "multi-statement"))
          if bad:
              print(json.dumps({"ok": False, "bad_probes": bad}))
              sys.exit(1)
          print(json.dumps({"ok": True, "probes": len(d.get("probes") or {})}))
          PY

      - name: Run the contract bridge
        id: bridge
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 scripts/remediation_contract_bridge.py | tee /tmp/remediation-bridge.json
          echo "--- bridge output above ---"

      - name: Publish the status artifact
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-status
          python3 - <<'PY'
          import datetime, json, pathlib
          raw = pathlib.Path("/tmp/remediation-bridge.json")
          try:
              d = json.loads(raw.read_text())
          except Exception as e:
              d = {"ok": False, "error": "no parseable bridge output: %s" % e}
          d["marker"] = "REMEDIATION-CONTRACT-BRIDGE-1"
          d["head"] = "${{ github.sha }}"
          d["job_status"] = "${{ job.status }}"
          # STATUS-THROTTLE-1: when this snapshot was written (a run stamp, ignored by the no-op comparison).
          d["ts"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          pathlib.Path("ci-status/remediation-bridge.json").write_text(json.dumps(d, indent=1)[:8000])
          print(json.dumps({k: d.get(k) for k in (
              "ok", "open_issues", "inserted_active", "inserted_needs_machine_probe",
              "active_contracts", "active_with_executable_probe",
              "active_with_prose_probe", "open_issues_without_active_contract")}))
          PY

      # STATUS-THROTTLE-1: every run's snapshot is kept here, so batching the git copy below loses no snapshot.
      - name: Upload the status artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remediation-bridge-status
          path: ci-status/remediation-bridge.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit the status artifact
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          # STATUS-NOOP-SKIP-1: a status file that differs only in run stamps (head, spent_ms, verifier) carries no
          # information; committing it only multiplies main pushes and CodeQL runs. Outcomes always still commit.
          # STATUS-THROTTLE-1 (ACTIONS-QUOTA-1): a count-only change (open_issues, residual_gap_ids, ...) commits at
          # most once per 30 min; a change in ok / job_status / error still commits at once. This writer pushed 108
          # of main's 648 commits in the 24h to 2026-10-02 09Z, and each started a CodeQL analysis ([skip ci] does
          # not stop CodeQL default setup). D1 remediation_contracts stays the record; the upload above keeps every run.
          git fetch -q origin main || true
          if python3 scripts/status_unchanged.py ci-status/remediation-bridge.json --ref origin/main --throttle-min 30; then
            git checkout -- ci-status/remediation-bridge.json 2>/dev/null || true
            echo "status unchanged apart from run stamps, or outcome unchanged within the 30 min window - not committing"
            exit 0
          fi
          git add ci-status/remediation-bridge.json
          if git diff --cached --quiet; then echo "no status change"; exit 0; fi
          git commit -m "ci(status): remediation-bridge [skip ci]"
          for i in 1 2 3; do
            if bash scripts/push_head.sh artifact; then
              echo "status pushed on attempt $i"
              exit 0
            fi
            sleep 4
          done
          echo "status push failed after 3 attempts"
          exit 0
