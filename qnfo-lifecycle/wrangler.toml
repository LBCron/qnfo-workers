name = "qnfo-lifecycle"
main = "worker.js"
# charter-pillar: reach
# COMPAT-ADVANCE-WAVE-1 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the old date and this one:
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module), 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy keeps the date only
# when /health answers with the deployed VERSION and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
# LIFECYCLE-PING-1042-1 (2026-10-05, agent_issues 1994): runPing and runSync fetch *.q08.workers.dev; without
# global_fetch_strictly_public that subrequest is Cloudflare error 1042 (same zone), served as HTTP 404. Measured:
# 150 "[lifecycle] PING FAIL ... HTTP 404" rows in worker_logs 2026-10-02..05 while both URLs answer 200 from outside.
# Same fix as FLEET-PROBE-1042-1 in qnfo-fleet-control/wrangler.toml.
compatibility_flags = ["global_fetch_strictly_public"]

[observability]
enabled = true
head_sampling_rate = 1

# WORKERS-STANDARDS-1 (owner standards 2026-10-12): logs and traces declared. Workers docs: `enabled` alone turns on logs only;
# traces need [observability.traces]. Traces are sampled at the default rate of 1 (low-traffic worker).
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

head_sampling_rate = 0.05 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01
[ai]
binding = "AI"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "qnfo-backups"

[[d1_databases]]
binding = "IPATENT_DB"
database_name = "ipatent-db"
database_id = "19cc87d6-4207-477c-bf8c-94fb231b8965"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"

[[d1_databases]]
binding = "PORTFOLIO_STATE"
database_name = "portfolio-state"
database_id = "d80fdf2a-0a60-45a3-968b-2907ce806dcd"

[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "QNFO_GRAPH"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

[triggers]
# CRON-CONSOLIDATE-1 (2026-09-27): 8 -> 5 crons. The four lightweight daily D1 tasks
# (lifecycle 0 3, memory-maintain 0 4, ula-check 0 7, drift-audit) are bundled into the
# single 0 3 fire. The former "9 6 * * *" was DEAD (handler keyed on "0 6 * * *").
# CRON-SINGLE-TRIGGER-1 (2026-10-02, #1785): ONE hourly trigger; worker.js CRON_TABLE holds the former list
# (0 * * * *, 0 0 1 * *, 0 3 * * *, 0 5 * * *, 0 8 * * 1) and runs each entry in the hour it fired.
crons = ["0 * * * *"]

# Secrets (wrangler secret put): CF_API_TOKEN

# FOLD-KIT-1: bindings calendar-api brought with it (folded into this worker).
[[r2_buckets]]
binding = "ICS_R2"
bucket_name = "qnfo-assets"

[[r2_buckets]]
binding = "VAULT"
bucket_name = "obsidian-vault"
