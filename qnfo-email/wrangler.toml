name = "qnfo-email"
main = "worker.js"
# charter-pillar: reach
# COMPAT-ADVANCE-WAVE-1 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the old date and this one:
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module), 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy keeps the date only
# when /health answers with the deployed VERSION and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
# OWNER-CMD-OPS-522-1 (2026-09-30): same-zone subrequests (email handler on qnfo.org -> ops.qnfo.org) only reach
# another Worker with this flag; without it every owner command 522d (#1472). Applied by the deployers' declared-flag union.
compatibility_flags = ["global_fetch_strictly_public"]

# Bindings verified from live CF API 2026-09-22 (BINDING-PRESERVATION-1).
# This config was previously ABSENT from the repo, so every deploy had to carry
# the bindings + compatibility_date out-of-band; an omitted compatibility_date
# silently dropped the live value. Tracked here so the repo is the deploy source
# of truth (REPO-IS-DEPLOY-SOURCE-1).

# Native Email Routing send binding — tokenless (no API key needed).
send_email = [
  { name = "SEND_EMAIL" }
]



# NOTICE-REPLY-1 (2026-10-09): ops authenticates this binding by ctx.props.caller (qnfo-ops OPS-INTERNAL-CALLER-1), so owner
# email commands no longer depend on a copy of the router key (OPS_KEY answered HTTP 401 after the 2026-10-01 rotation).
[[services]]
binding = "OPS"
service = "qnfo-ops"
environment = "production"
props = { caller = "qnfo-email" }

# EMAIL-VOICE-DRAFTER-1 (2.8.0, agent_issues 2373): the voice document lives in the private store bound to the dashboard alone
# (IDENTITY-STORE-1); this binding reads and proposes it through /api/owner/doc/<key>, authenticated by props.caller.
[[services]]
binding = "DASH"
service = "qnfo-fleet-dashboard"
environment = "production"
props = { caller = "qnfo-email" }

# EMAIL-VOICE-DRAFTER-1: the writer and editor models (two families) run on Workers AI; qnfo-ai stays the router for callers
# that need it, this worker makes two short calls per human thread.
[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1
# Workers standards 2026-10-12: logs and traces both on (shape per developers.cloudflare.com/workers/observability/traces).
[observability.logs]
enabled = true
head_sampling_rate = 1
# Mail invocation records include raw sender and recipient addresses.
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 0.05 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01

[[d1_databases]]
binding = "AUDIT_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# ITINERARY-INGEST-1 (#1881, charter pillar personal): the itinerary parser writes personal-life.events (lodging/travel rows
# the away gate and the brief read). Writes happen only for DMARC-verified booking-company or owner mail; see worker.js.
[[d1_databases]]
binding = "PERSONAL"
database_name = "personal-life"
database_id = "e8d6c61a-10b7-4086-b81e-9e6e85afa407"

# Daily inbound-digest cron. NOTE: qnfo-email is also invoked via the qnfo.org
# email-routing worker (fetch handler); this cron drives scheduled() ->
# sendInboundDigest(). Personal calendar acknowledgments/reminders use the same
# 15-minute tick and SEND_EMAIL binding; retired qnfo-calendar-intake stays retired.
# CRON-RATE-CEILING-1 (owner directive 2026-09-23): this declaration previously said
# "*/5 * * * *" while the LIVE schedule was already the daily 07:00 cron -- a latent violation
# (288 fires/24h) that any wrangler deploy would have applied. Repo now matches LIVE.
[triggers]
# EMAIL-TICK-1 (2.9.0, 2026-10-12): the voice drafter and the reply drain run every 15 minutes (96 fires/24h, under the
# CRON-RATE-CEILING-1 floor of one fire per 10 minutes); the index, freshness and voice-learning steps run once a day at 07:00 inside that tick
# (CRON-GRID-1, 2.10.0: no trigger slower than hourly; worker.js CRON_GRID_CFG).
crons = ["*/15 * * * *"]

# Secrets (set via `wrangler secret put`, never committed):
#   GATEWAY_EMAIL_KEY   - AI Gateway key for reply drafting
#   INGEST_TOKEN        - /ingest auth
#   OPS_KEY             - ops command passthrough
