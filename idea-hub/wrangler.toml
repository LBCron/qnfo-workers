name = "idea-hub"
main = "worker.js"
# charter-pillar: research
account_id = "edb167b78c9fb901ea5bca3ce58ccc4b"
compatibility_date = "2026-10-10"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

# Bindings mirror the live worker (verified 2026-10-17 via /script-settings).
# v1.10.6-admission-cap deployed 2026-10-17 (version 7b2fe7bd-5eca-48b7-971b-d0619a2657c3).

[observability]
enabled = true
head_sampling_rate = 1

# WORKERS-BP-DEBT-1 idea-hub (agent_issues 2756, RESOLVE-ALL-OPEN-1 2026-10-19): `enabled` alone turns on logs only; traces need
# [observability.traces]. Sampled like the rest of the fleet (TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01).
[observability.traces]
enabled = true
head_sampling_rate = 0.05

[ai]
binding = "AI"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"

[[r2_buckets]]
binding = "VAULT"
bucket_name = "obsidian-vault"

[triggers]
crons = ["25 * * * *"]
