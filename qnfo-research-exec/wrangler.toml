name = "qnfo-research-exec"
main = "worker.js"
# charter-pillar: research
# COMPAT-ADVANCE-WAVE-2 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# from 2026-08-01 to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the two dates:
# 2026-08-04 nodejs_compat default on: this worker already declares the flag, so nothing changes;
# 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy reads /health through its
# COMPAT-HEALTH-BINDINGS-2 binding before the upload, keeps the date only when /health answers with the deployed VERSION
# and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
# ERRATA-FOLD-1 (#1756): the folded errata-hub member imports node:buffer.
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# ERRATA-FOLD-1: errata-hub's outbound mail (errata notices) and its PDF rendering move here with the member.
send_email = [
  { name = "SEND_EMAIL" }
]

[browser]
binding = "BROWSER"

# AI binding (Workers AI) - REQUIRED for note/paper generation via env.AI.run
[ai]
binding = "AI"

# D1: audit log + research queue
[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# D1: living-paper store (papers table)
[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

# R2: paper markdown mirror (post-publish)
[[r2_buckets]]
binding = "MIRROR"
bucket_name = "qnfo-releases"

# D1: knowledge graph (KG node sync on publish/newversion)
[[d1_databases]]
binding = "GRAPH_DB"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

# Service: qnfo-pdf (HTML/PDF rendering for provenance packages)
[[services]]
binding = "PDF_SVC"
service = "qnfo-pdf"

# Service: qnfo-ai (research gateway / model router) - ROUTER-EGRESS-BINDING-ABSENT-1.
# routerFetch() in worker.js prefers env.QNFO_AI and otherwise falls back to a PUBLIC fetch.
# A public fetch to a same-account workers.dev hostname does not work from Worker context
# (the repo already records this class on the qnfo-autopilot wrangler: a missing binding made
# expressIdea fall back to a public workers.dev fetch, which returns 404 from a Worker), so
# every gwCall silently degraded to the Workers AI fallback model:
#   cloud_ops_events kind=gw-fallback n=608, first 2026-09-16T10:41:55Z, last 2026-09-29T16:17:23Z
# See agent_issues 1406 (ROUTER-EGRESS-BINDING-ABSENT-1) and the reopened 1222.
#
# IMPORTANT: adding the binding here is necessary but not sufficient on its own. The two
# automated deployers in this repo are BINDING-PRESERVING (scripts/raw_put.py and the
# canonical /ops/deploy sequence both PUT /content and re-send the EXISTING binding set), so
# they can never ADD a binding. Only a deployer that installs from this file (cf_worker_deploy)
# or a wrangler deploy applies it. scripts/router-transport-failover-patch.py therefore also
# adds an ordered public-host failover in code, so the pipeline stops degrading even before the
# binding is installed.
[[services]]
binding = "QNFO_AI"
service = "qnfo-ai"
# INTERNAL-CALLER-PROPS-1 (#1703): qnfo-ai authenticates this binding by ctx.props.caller, so a router key
# rotation no longer strands this worker. Installed by qnfo-ops BINDING-PROPS-APPLY-1 on the canonical deploy.
props = { caller = "qnfo-research-exec" }

# Service: qnfo-containers-pilot (Python execution for the verify stage) - PILOT-PROPS-CALLER-1 (2026-10-01).
# The pilot refuses command paths on its public hostname (PILOT-PUBLIC-EXEC-CLOSED-1), so the verify stage calls
# https://containers-pilot.internal/exec through this binding; the pilot authenticates the caller by these props.
[[services]]
binding = "CONTAINERS_PILOT"
service = "qnfo-containers-pilot"
props = { caller = "qnfo-research-exec" }

# Cron: research pipeline drain. RESEARCH-THROUGHPUT-1 (2026-10-01, issues 1700/1620): a paper needs ~8-10 stages
# (ground, ensemble, reconcile, review, revise x cycles, verify) and each hourly tick completed only 1-2 of them (the
# 4-min loop budget ends after the first slow stage), so one paper took ~10h and 25 queued rows would have taken >1 week.
# The single-flight lease (RESEARCH-SINGLE-FLIGHT-1) serialises runs, so a 15-min cadence is safe: an overrunning
# stage just makes the next tick log lease-busy.
[triggers]
crons = ["*/10 * * * *"] # TICK-10M-1 (0.18.38, owner directive 2026-10-18: idea to publication < 100 h): was */15; 144/day = CRON-MANDATE-1 ceiling

[observability]
enabled = true
head_sampling_rate = 1

# WORKERS-STANDARDS-1 (owner standards 2026-10-12): logs and traces declared. Workers docs: `enabled` alone turns on logs only;
# traces need [observability.traces]. Sampled at the default rate of 1.
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

# CANONICAL-DEPLOY-AUTO-1 (2026-09-29, issue #1406): comment-only touch so that
# .github/workflows/canonical-deploy.yml fires for this worker. That workflow deploys
# through scripts/canonical_deploy.py, which acquires the deploy-guard lock, writes the
# fleet ledger row, installs declared bindings where the live ops deployer supports it
# (BINDING-INSTALL-MERGE-1, issue #1448), and PUTs the [triggers] crons above so they
# stop being inert. Deployed artifact is unchanged by this comment; only the deploy
# PATH changes, which is the actual defect.
head_sampling_rate = 0.05 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01
