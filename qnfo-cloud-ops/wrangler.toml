name = "qnfo-cloud-ops"
main = "worker.js"
# charter-pillar: autonomy
# COMPAT-ADVANCE-WAVE-2 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# from 2026-08-01 to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the two dates:
# 2026-08-04 nodejs_compat default on: this worker already declares the flag, so nothing changes;
# 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy reads /health through its
# COMPAT-HEALTH-BINDINGS-2 binding before the upload, keeps the date only when /health answers with the deployed VERSION
# and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
compatibility_flags = ["nodejs_compat"]


[observability]
enabled = true
head_sampling_rate = 1

# WORKERS-STANDARDS-1 (2026-10-12, Workers best practices; audit check traces-not-declared): `enabled` alone turns on logs only, traces
# need [observability.traces]. Logs stay at 1 (the worker runs crons and owner mail, every invocation matters); traces are sampled
# because stored traces bill from 2026-12-01 (TRACES-SAMPLING-BEFORE-BILLING-1). The canonical deploy sends this block in the upload
# metadata (qnfo-ops OBSERVABILITY-DECLARED-APPLY-1).
[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[ai]
binding = "AI"

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# secret (set via wrangler secret put): CF_TOKEN
# secret (set via wrangler secret put): DIGEST_TO
[[services]]
binding = "EMAIL"
service = "qnfo-email"
# EMAIL-ORCH-FOLD-1 (#1756, CLAUDE.md #1703 rule): qnfo-email 2.5.1+ authenticates a service binding by ctx.props.caller,
# so the folded qnfo-email-orchestrator member's /send calls (and this worker's own) need no key copy.
# Installed by qnfo-ops BINDING-PROPS-APPLY-1 on the canonical deploy.
props = { caller = "qnfo-cloud-ops" }

# RESEARCH-WATCHDOG-1 (1.33.0, agent_issues 2838): the second trigger path of qnfo-research-exec. The watchdog forces one stage with
# POST /run?sync=1 on an internal host (RUN-INTERNAL-1 lets a service binding in; no secret). Installed by the canonical deploy.
[[services]]
binding = "RESEARCH_EXEC"
service = "qnfo-research-exec"
props = { caller = "qnfo-cloud-ops" }

# BREACH-DOCTOR-WATCH-2 (1.40.0, agent_issues 1000397): the second runner of the breach doctor. When the doctor tick of qnfo-fleet-control (*/10) stalls, jobBreachDoctorWatch calls
# POST /breach-doctor/run on this binding (and once a day as a drill). qnfo-fleet-control answers only a service binding whose ctx.props.caller is qnfo-cloud-ops; no key is involved.
# A Worker's fetch to a workers.dev host of its own account fails (issue 1190), so the call has to be a binding. Installed by qnfo-ops BINDING-PROPS-APPLY-1 on the canonical deploy.
[[services]]
binding = "FLEET_CONTROL"
service = "qnfo-fleet-control"
props = { caller = "qnfo-cloud-ops" }

# secret (set via wrangler secret put): EMAIL_API_KEY
# secret (set via wrangler secret put): GH_TOKEN
# secret (set via wrangler secret put): GMAIL_PASS
[[d1_databases]]
binding = "GRAPH"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

# secret (set via wrangler secret put): INFRA_TOKEN
# PAPER-LEDGER-ARCHIVE-1 (1.38.0): old stored bodies of the paper ledger are copied here (key paper-ledger/<seq>.md) before they leave living-paper. Same bucket qnfo-pdf binds as RELEASES.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "qnfo-releases"

[[d1_databases]]
binding = "LIVING"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[d1_databases]]
binding = "OUTREACH"
database_name = "qnfo-outreach"
database_id = "d5077252-8187-41b2-a44e-f84f8724ee36"

# secret (set via wrangler secret put): OPS_ADMIN_TOKEN
#
# OPS_VZ-INDEX-DELETED-1 (2026-09-30, qnfo-ops remediation, issue-class DEPLOY-BLOCKED):
# the Vectorize binding below was declared here, but the referenced index
# `qnfo-cloud-ops` NO LONGER EXISTS in the account. Any deploy that merges this
# declaration is rejected by the Cloudflare API with
#   HTTP 400 / code 10160 "Vectorize binding 'OPS_VZ' references index
#   'qnfo-cloud-ops' which has been deleted"
# which is recorded verbatim in qnfo-audit deployment_history ids 194 and 195
# (qnfo-ops:cf_worker_deploy, 2026-09-30T08:03:20Z and 08:05:17Z). GET
# /workers/scripts/qnfo-cloud-ops/bindings returns 15 bindings and NO vectorize
# binding, so the LIVE worker does not carry OPS_VZ at all -- the declaration was
# dead weight whose only observable effect was to fail every binding-merging deploy
# of this worker, which in turn blocked landing the jobOutreach fix (issues
# 1294/1508) and the cron-registration repair (issue 1500).
#
# The worker guards every use with `if (env.OPS_VZ)` (worker.js lines 103, 2237,
# 2263), so omitting the binding degrades the optional cloud-ops doc index and
# breaks nothing else. Commented out to match live reality. RE-ENABLE ONLY AFTER
# the index is recreated in the account.
# [[vectorize]]
# binding = "OPS_VZ"
# index_name = "qnfo-cloud-ops"

[[d1_databases]]
binding = "PORTFOLIO"
database_name = "portfolio-state"
database_id = "d80fdf2a-0a60-45a3-968b-2907ce806dcd"

[[services]]
binding = "QNFO_INFRA"
service = "qnfo-infra"

# WORKER-HEALTH-PROBE-AUTH-1 (1.18.2): the worker-health chat probe calls qnfo-ai through this binding. INTERNAL-CALLER-PROPS-1
# (#1703): qnfo-ai authenticates it by ctx.props.caller, so no copy of ROUTER_AUTH_KEY is needed (the probe's old reference
# to one is retired with this binding; the secret was never re-set after the 2026-09-26 recreation, #1468). Installed by
# qnfo-ops BINDING-PROPS-APPLY-1 on the canonical deploy.
[[services]]
binding = "QNFO_AI"
service = "qnfo-ai"
props = { caller = "qnfo-cloud-ops" }

# v1.13.1 - self-registration to the qnfo-ops service registry (cross-service discovery).
# Secret: REGISTRY_TOKEN (shared with qnfo-ops /registry/register) - set via wrangler secret put.
[[services]]
binding = "QNFO_OPS"
service = "qnfo-ops"

# SEND-EMAIL-SENDER-RESTRICT-1 (2026-10-13, agent_issues 2421, pillar security; applied by qnfo-ops 2.45.0 on the next canonical
# deploy): the binding may send only as the two addresses worker.js sends as, read from its three env.SEND_EMAIL.send calls:
# sendDigest from alerts@qnfo.org, and the outreach first touch and follow-up from OUTREACH_FROM (rowan.quni@qnfo.org).
# A new sender address in worker.js must be added here in the same PR, or its send is refused. One line: the installer reads
# one line per key.
[[send_email]]
binding = "SEND_EMAIL"
name = "SEND_EMAIL"
allowed_sender_addresses = ["alerts@qnfo.org", "rowan.quni@qnfo.org"]

[[r2_buckets]]
binding = "VAULT"
bucket_name = "d-drive"

# AMS_SCHEDULE-derived cron triggers. CF-DOW-1: ISO->CF day-of-week corrected
# (Cloudflare cron DOW is 1=Sunday..7=Saturday, NOT ISO 1=Monday). 21 jobs.
# Re-sync offsets at the 2026-10-25 CET flip (+2 CEST -> +1 CET).
#
# CRON-LIMIT-CORRECTED-1 (2026-09-30, qnfo-ops remediation of issue 1665).
# The previous comment here cited a now-deleted per-Worker cron-cap guard
# constant in scripts/raw_put.py and asserted Cloudflare accepts at most 3 cron
# triggers per Worker. Both claims were stale. Corrected against live evidence:
#   (a) No per-Worker cron-cap constant exists in scripts/raw_put.py (repo HEAD
#       8719134). The current guard is `CF_ACCOUNT_MAX_CRONS = 250`, which
#       encodes the per-ACCOUNT cap.
#   (b) The cap is per ACCOUNT, not per Worker: Cloudflare Workers docs "Limits"
#       (last updated 2026-09-05) list "Number of Cron Triggers per account:
#       5 (Free) / 250 (Paid)". No per-Worker cron cap is documented.
#   (c) The live worker carries all 21 triggers, not one:
#       worker_schedules (refreshed 2026-09-30T19:00:41.138Z) returns 21 crons
#       byte-identical to the [triggers] list below, and deployment_history rows
#       204/205 (2026-09-30T08:49Z) record schedules=APPLIED for the
#       1.15.3-schedules-live-1 deploy. This list IS the applied reality.
#
# Issue 1500 (CLOUD-OPS-CRON-DISPATCH-NOOP-1) remains open for its own distinct
# defect (stale worker_schedules row vs the internal dispatch map), which this
# comment correction does not address.
# CRON-SINGLE-TRIGGER-1 (2026-10-02, #1785): ONE trigger. worker.js (TICK_CRON) works out which AMS_SCHEDULE jobs are
# due in Amsterdam local time on each tick, so this list no longer changes with the schedule or with daylight saving.
# Every 10 minutes is the fastest CRON-RATE-CEILING-1 allows; a job on a :05 or :15 mark runs on the next tick.
# The comments above describe the 21-trigger list this replaced.
[triggers]
crons = ["*/10 * * * *"]
