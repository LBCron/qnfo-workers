# Trigger-created placeholder for mind worker.
# See QNFO/qnfo-workers for the real source.
name = "q08-mind"
main = "worker.js"
# charter-pillar: personal
# compat-advance: reviewed 2026-11-05 (compat-risk-scan clean; no websockets or Durable Objects; no COMPAT_FLIPS entry after 2026-10-01)
compatibility_date = "2026-11-04"

# MIND-DIR-CONVERGE-1 (0.33.2, 2026-10-25): the directory carried the deployed worker's old short name, so the fleet graph
# reported both halves of one fact: "mind" was an undeployed directory and "q08-mind" a deployed script with no tracked
# source, and the missing [observability] block was the single severity=fail anti-pattern behind
# metric workers_bp_findings_open = 1. One rename plus this block clears all three.
[observability]
enabled = true
head_sampling_rate = 0.1

# Explicitly disable traces to satisfy the workers_bp anti-pattern check.
# Traces are free until 2026-12-01; this declaration keeps the lint green
# without adding billable ingestion. Revisit before the pricing change.
[observability.traces]
enabled = false
