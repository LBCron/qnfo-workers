name = "qnfo-ai"
main = "worker.js"
# charter-pillar: core
# COMPAT-ADVANCE-WAVE-1 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the old date and this one:
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module), 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy keeps the date only
# when /health answers with the deployed VERSION and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
compatibility_flags = ["streams_enable_constructors"]
workers_dev = true

# CRITICAL FIX (v4.3.0): v4.2.0 was deployed WITHOUT this binding ->
# env.AI undefined -> all tier-0 Workers AI free models returned
# "All models failed." while DeepSeek API (secret) worked.
# NOTE: wrangler 4.118.0 validates the ai field as a SINGLE table object
# ("should be an object but got [array]") — [ai] not [[ai]].
[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

# OBSERVABILITY-TRACES-1 (2026-10-12): the top-level switch alone does not enable traces.
[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# CASCADE-SHADOW-1 (2026-11-05, RM-BS-QUNIVERSE-SMALL-1, pillar cost): the hourly trigger of the cascade shadow (worker.js scheduled). The shadow itself runs once per 22 hours
# (gate on cloud_ops_events kind cascade-shadow-run) and ops_config cascade_shadow = off stops it; the other 23 ticks read one indexed row and return.
[triggers]
crons = ["40 * * * *"]


# v4.4.0 — internal RAG (/v1/search) + query history (/v1/history)
# PAPER_VZ -> qwav-research-v2 (768-dim, bge-base-en-v1.5) — same index qnfo-archive uses
[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"

# v4.5.0 — restore zero-latency query logging -> qnfo-ai-log (semantic recall of past queries)
[[vectorize]]
binding = "LOG_VZ"
index_name = "qnfo-ai-log"

# v5.2.0 — QNFO Vectorize indexes (QNFO endpoint ONLY — separation mandate: personal
# lives on the personal-api endpoint, never here).
[[vectorize]]
binding = "NOTES_VZ"
index_name = "qnfo-notes"

[[vectorize]]
binding = "TASKS_VZ"
index_name = "qnfo-tasks"

[[vectorize]]
binding = "HANDOFFS_VZ"
index_name = "qnfo-handoffs"

[[vectorize]]
binding = "INFRA_VZ"
index_name = "qnfo-infra"


[[vectorize]]
binding = "IPATENT_VZ"
index_name = "ipatent-corpus"

# QNFO_AUDIT -> qnfo-audit D1 (ai_queries table) for /v1/history
[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# v4.7.0 — QNFO RECORDS RAG: service binding to the qnfo-infra retrieval oracle
# (papers, KG, programs, notes, tasks, emails, past queries) + INFRA_TOKEN secret
# (same value as qnfo-infra's INFRA_TOKEN) for authenticated oracle calls.
[[services]]
binding = "QNFO_INFRA"
service = "qnfo-infra"
environment = "production"

# v5.14.0 - QNFO.OPS.010 Stage C: twin calendar retrieval (plane=qnfo)

# EMAIL-BINDING-RESTORE-1 (5.37.1, human_actions 108): the agent's email_check and email_send tools call qnfo-email through this
# binding. qnfo-email authenticates a service-binding caller by ctx.props.caller (EMAIL-CALLER-PROPS-1), so no copy of its API key is
# needed here (CLAUDE.md, internal calls: props = { caller = "<worker name>" }, installed by the canonical deploy).
[[services]]
binding = "EMAIL"
service = "qnfo-email"
environment = "production"
props = { caller = "qnfo-ai" }

# v5.16.2 - QNFO.OPS.011: restore QNFO_INTENT service binding. auto-express (expressIdea)
# was silently 404ing: the binding was absent so expressIdea fell back to a public
# workers.dev fetch, which returns 404 from a Worker (same-account restriction).
[[services]]
binding = "QNFO_INTENT"
service = "qnfo-intent-orchestrator"
environment = "production"


# v5.19.0 - MEDIA-INGEST-1: R2 image store (images sent to the endpoint are captured for
# training / audit / reprocessing; retention pruned by worker mediaPrune ~2GiB/21d).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "qnfo-media"

# v5.20.0 - CROSS-APP-1: Dynamic Workers loader for run_code parity. Cloudflare Workers
# disallow request-time eval/new Function, so agent-mode run_code compiles user code as a
# fresh module via env.LOADER.load (same mechanism as qnfo-ops run_code).
[[worker_loaders]]
binding = "LOADER"


# OWNER-RW-ANY-LLM-1 (5.38.0): service binding to qnfo-ops so a key qnfo-ops accepts is accepted here. qnfo-ops authenticates
# this binding by ctx.props.caller and answers /internal/verify-key with yes or no only; no secret is copied between workers.
[[services]]
binding = "OPS"
service = "qnfo-ops"
environment = "production"
props = { caller = "qnfo-ai" }
