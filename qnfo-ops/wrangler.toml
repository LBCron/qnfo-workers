# DO-MIGRATION-NOTE-1 2026-09-22 (R3/F2): a `wrangler deploy --dry-run` validates
# client-side structure ONLY - it cannot prove the server accepts this migration. The
# class already exists (created via the API), so a real wrangler deploy may FAIL CLOSED
# (Cloudflare rejects a creating migration for an already-depended-on class). It never
# wipes. The operative deploy path remains scripts/raw_put.py (binding-preserving).

name = "qnfo-ops"
main = "worker.js"
# charter-pillar: core
# COMPAT-ADVANCE-WAVE-2 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# from 2026-08-01 to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the two dates:
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module);
# 2026-10-01 Durable Object eviction (pending I/O keeps this worker's Durable Object in memory until it completes). /ops/deploy reads /health through its
# COMPAT-HEALTH-BINDINGS-2 binding before the upload, keeps the date only when /health answers with the deployed VERSION
# and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
workers_dev = true

# CPU-BUDGET-1 (2026-09-06): raise the per-request CPU ceiling from the platform default (30s)
# to the 5-minute max so the 180s soft wall budget (OPS_LOOP_DEADLINE_MS, OPS-TIME-BUDGET-1) is
# the binding constraint - NOT Cloudflare's default 30s active-CPU limit (Error 1102 exceededCpu).
# Context: developers.cloudflare.com/workers/platform/limits - HTTP wall time is Unlimited while
# streaming (heartbeats keep the client connected); active CPU is the real per-request ceiling and
# counts run_code executions + per-round JSON.stringify/truncateToContext, NOT I/O waits (DeepSeek
# fetch, D1/R2/Vectorize). Cost: 30M CPU-ms/mo included on Standard; $90/30d spend guard applies.
[limits]
cpu_ms = 300000

# ============================================================
# qnfo-ops v1.0.0 — OPS/INFRASTRUCTURE AI EXECUTION ENDPOINT
# Purpose: OpenAI-compatible ops agent (DeepChat + ChatBox) that
# executes code/actions on the cloud-native fleet. STRICTLY
# separated from the qnfo-ai RESEARCH feed and personal-api:
# logs ONLY to qnfo-audit.ops_ai_log + cloud_ops_events; never
# writes ai_queries / chatbox_conversations / intent_express_log
# and never calls the intent orchestrator (no idea-stream clutter).
# Upstream LLM: api.deepseek.com (DEEPSEEK_API_KEY secret),
# model deepseek-v4-flash (direct, supports tools + streaming).
# Auth: Bearer OPS_ROUTER_AUTH_KEY secret (SHA-256 compare).
# ============================================================

[observability]
enabled = true
head_sampling_rate = 1

# OBSERVABILITY-DECLARED-APPLY-1 (qnfo-ops 2.41.0): logs and traces are declared here and the canonical deploy sends them
# in the upload metadata (overlaid on the live settings). Measured 2026-10-12: all 28 live workers already had both on.
[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.05 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01

# Ops audit store: qnfo-audit D1 (ops_ai_log + cloud_ops_events + agent_issues)
[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# --- Preserved v0.4 fleet-probe service bindings (11) ---
[[services]]
binding = "LIFECYCLE"
service = "qnfo-lifecycle"
environment = "production"

[[services]]
binding = "EMAIL"
service = "qnfo-email"
environment = "production"


# INDEXER (qnfo-paper-indexer) removed 2026-10-06: folded into qnfo-infra (INDEXER-FOLD-1, #1756); the binding was a /health and
# /count probe only. The count is at https://qnfo-infra.q08.workers.dev/indexer/count.

# KAIZEN (qnfo-kaizen) removed 2026-10-06: worker retired (WORKER-RETIRE-WAVE-2, #1756); the binding was a /health probe only.

[[services]]
binding = "GATEWAY"
service = "qnfo-gateway"
environment = "production"

# ARCHIVE (qnfo-archive) removed 2026-10-06: worker retired (ARCHIVE-RETIRE-1, #1756); the binding was a /health probe only.

[[services]]
binding = "AI"
service = "qnfo-ai"
environment = "production"
# INTERNAL-CALLER-PROPS-1 (#1703): qnfo-ai authenticates this binding by ctx.props.caller, so a router key
# rotation no longer strands this worker. Installed by qnfo-ops BINDING-PROPS-APPLY-1 on the canonical deploy.
props = { caller = "qnfo-ops" }

[[services]]
binding = "AISEARCH"
service = "qnfo-ai-search"
environment = "production"

[[services]]
binding = "MEMORY"
service = "qnfo-memory-mcp"
environment = "production"

# SKILLSYNC (qnfo-skill-sync) removed 2026-10-06: worker retired (WORKER-RETIRE-WAVE-2, #1756); the binding was a /health probe only.

# --- v1.0.0 additions ---
# Backlog executor drain (ops_issue_run tool)
[[services]]
binding = "BACKLOG"
# BACKLOG-FOLD-1 (#1756): qnfo-backlog-exec runs as a member of qnfo-lifecycle; props.member routes this binding to the
# member, so https://backlog.internal/run (ops_issue_run) and the /health probe reach it unchanged. The live binding to the
# old script is removed after that script is deleted (cf-ops-actions unbind-service, SERVICE-REPOINT-1); the next canonical
# deploy installs this one.
service = "qnfo-lifecycle"
environment = "production"
props = { caller = "qnfo-ops", member = "qnfo-backlog-exec" }

# Secrets (set via wrangler secret put / API; never in git):
#   OPS_ROUTER_AUTH_KEY  - Bearer auth for /v1/chat/completions (mirror ~/.env)
#   DEEPSEEK_API_KEY     - api.deepseek.com upstream key (same value as DeepChat deepseek provider)
#   EMAIL_API_KEY        - preserved from v0.4 (qnfo-email API key, Bearer)

# v1.2.0 - Dynamic Workers loader (run_code server tool): compiles user JS into a
# fresh sandboxed Worker per call (network cut via globalOutbound: null; no bindings).
[[worker_loaders]]
binding = "LOADER"

