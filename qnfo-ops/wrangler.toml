# Vectorize (semantic search via vectorize_query)
[[vectorize]]
binding = "RESEARCH_VZ"
index_name = "qwav-research-v2"

[[vectorize]]
binding = "NOTES_VZ"
index_name = "qnfo-notes"

[[vectorize]]
binding = "TASKS_VZ"
index_name = "qnfo-tasks"

[[vectorize]]
binding = "HANDOFFS_VZ"
index_name = "qnfo-handoffs"

[[vectorize]]
binding = "AILOG_VZ"
index_name = "qnfo-ai-log"

# R2 (object list/get via r2_list / r2_get)
[[r2_buckets]]
binding = "RELEASES_R2"
bucket_name = "qnfo-releases"

[[r2_buckets]]
binding = "AUDIT_R2"
bucket_name = "qnfo-audit"

[[r2_buckets]]
binding = "BACKUPS_R2"
bucket_name = "qnfo-backups"

[[r2_buckets]]
binding = "SKILLS_R2"
bucket_name = "qnfo-skills"

# CANONICAL-REFRESH-1 (2.59.4, agent_issues 1000161): /ops/deploy writes qnfo-canonical/<worker>.js after a deploy whose /health version
# matches the requested one, so the artifact that the heal and drift paths re-assert is never older than live. The canonical deploy installs
# declared bindings; while this one is absent the route skips the write and records a canonical_refresh row with status skipped.
[[r2_buckets]]
binding = "CANONICAL"
bucket_name = "qnfo-canonical"

# KV (key read via kv_get)
[[kv_namespaces]]
binding = "EQCACHE_KV"
id = "2fbbb9fa2d774a6e80d3a3d2547f8b5f"

# COST-ROUTING-STACK-1 L1: exact-match chat cache (1h TTL)
[[kv_namespaces]]
binding = "OPS_CACHE_KV"
id = "a277c879f01a48198304ab8f24a212d2"

# COST-ROUTING-STACK-1 L1: semantic chat cache (bge-base-en-v1.5 768-dim cosine)
[[vectorize]]
binding = "SEMCACHE_VZ"
index_name = "qnfo-ops-semcache"

# Service binding: intent orchestrator (research_feed expresses RESEARCH ideas only)
[[services]]
binding = "QNFO_INTENT"
service = "qnfo-intent-orchestrator"
environment = "production"

# Workers AI (text embeddings for vectorize_query / research_feed)
[ai]
binding = "WAI"

# v1.5.0: service registry auto-refresh (self-heal discovery) every 30 min
# OPS-DURABLE-1 (2026-09-06): async/durable ops-exec jobs. POST /v1/jobs (or x-ops-async:1 on chat)
# enqueues to qnfo-ops-jobs; this worker's queue() consumer creates an ops-exec-workflow instance;
# OpsExecWorkflow (worker.js export class) runs the durable agent loop (each LLM round + tool call
# is a step.do -> individually retryable, survives isolate recycling, not bound by request CPU/wall).
[[queues.producers]]
binding = "OPS_JOBS_QUEUE"
queue = "qnfo-ops-jobs"

[[queues.consumers]]
queue = "qnfo-ops-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "qnfo-ops-jobs-dlq"

[[workflows]]
binding = "OPS_EXEC_WORKFLOW"
name = "ops-exec-workflow"
class_name = "OpsExecWorkflow"

[triggers]
crons = ["*/30 * * * *"]

[[services]]
binding = "CONTAINERS_PILOT"
service = "qnfo-containers-pilot"
environment = "production"

# CF-AGENTS-1 (2.57.0): the fleet's Cloudflare Agents SDK agent behind /v1/agents/*. qnfo-agents trusts caller "qnfo-ops".
[[services]]
binding = "AGENTS"
service = "qnfo-agents"
props = { caller = "qnfo-ops" }

# SERVER-SIDE-DEPLOY-1 (2026-09-19): service binding to the deploy-guard lock service.
# A Worker on *.q08.workers.dev CANNOT fetch another Worker on the same zone (Cloudflare
# error 1042), so the lock/ledger calls go through this binding, not global fetch.
[[services]]
binding = "DEPLOY_GUARD"
service = "qnfo-deploy-guard"
environment = "production"

# AgenticOpsExec Durable Object — real WebSocket-hibernated ops agent session (2026-09-14)
[[durable_objects.bindings]]
name = "AGENTIC_OPS_EXEC"
class_name = "AgenticOpsExec"

# DO-EXPORT-EXPLICIT-1 (2026-09-19): declare the Durable Object export explicitly. wrangler 4.118
# warns that a `durable_objects` binding without a live `exports` entry may not work as expected;
# making it explicit removes the warning and pins the storage backend.
[exports.AgenticOpsExec]
type = "durable-object"
storage = "sqlite"

