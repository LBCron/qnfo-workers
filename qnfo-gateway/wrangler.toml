name = "qnfo-gateway"
main = "worker.js"
# charter-pillar: core
# COMPAT-ADVANCE-WAVE-1 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the old date and this one:
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module), 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy keeps the date only
# when /health answers with the deployed VERSION and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"


[observability]
enabled = true
head_sampling_rate = 1

# WORKERS-STANDARDS-1 (owner standards 2026-10-12): logs and traces declared. Workers docs: `enabled` alone turns on logs only;
# traces need [observability.traces]. Traces are sampled at the default rate of 1.
# BP26-PII-LOGS-1 (cluster D, 2026-10-28, pillar security; metric pii_in_logs, agent_issues 1000486): invocation logs record every request header, and crawlers send an
# e-mail address in the `From` header (32 raw address matches in a 24 h sample, all qnfo-gateway). Application logs (console.log) stay on. Revert: invocation_logs = true.
[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 0.01 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

# FLEET-HARDENING-2 (agent_issues 2397): the daily cron writes its qnfo-audit fleet_heartbeat row (heartbeat only).
[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[r2_buckets]]
binding = "QNFO_BUCKET"
bucket_name = "qnfo"

# SCHOLAR-PDF-URL-1 (#1714): qnfo-pdf renders each paper to pdf/<slug>.pdf here (papers.pdf_path). The gateway serves it
# at /papers/<slug>.pdf when no other PDF is available.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "qnfo-releases"

# MATH-BROWSER-2 (#1890): the 06:00 cron samples five live paper pages through qnfo-pdf's internal /math-check
# (Browser Run + MathJax) and serves the report as browser_sample in /api/render-health.
[[services]]
binding = "PDF_SVC"
service = "qnfo-pdf"

# REACH-AE-1b (2026-11-05, pillar reach, agent_issues 1000699 and 1001879): the one Workers Analytics Engine binding for first-party per-page reach events. The fetch tail writes one
# data point per human HTML page load (reachAeEvent, reachAeWrite); qnfo-infra reads dataset qnfo_reach back every hour into reach_signals (source reach-ae). The dataset is created
# by the first write. Revert: remove this block and the call in the fetch tail (a missing binding writes nothing).
[[analytics_engine_datasets]]
binding = "REACH_AE"
dataset = "qnfo_reach"

# Secrets (wrangler secret put): SYNC_TOKEN, TURNSTILE_SECRET

# CRON-DETACH-1 (2026-10-25, agent_issues 100450): a raw PUT /content deploy on 2026-10-20 left this trigger
# unattached for ~5 days (last cron_fire_log row 2026-10-20T12:00:43Z, 113 consecutive worker-silent fails).
# [triggers] is applied only by PUT /schemas/deployments/schedules in the canonical path (/ops/deploy), never by
# PUT /content alone. This comment ships the re-attach deploy.
[triggers]
crons = ["0 * * * *"]
